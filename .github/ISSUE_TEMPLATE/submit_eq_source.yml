name: Submit an EQ source
description: Suggest an original or traceable EQ preset/source for the EQ Library.
title: "[EQ source] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Submissions enter the validation, provenance, headphone-identity, deduplication, and revision pipeline. Mechanically valid submissions from approved public community sources may be published automatically as **Unverified**. Ambiguous or incomplete submissions stay in review. Unverified entries keep the original source link so users can investigate the tuning themselves.
  - type: input
    id: manufacturer
    attributes:
      label: Manufacturer
      description: Use the manufacturer/brand shown by the original source or product maker.
      placeholder: HIFIMAN
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Exact model
      description: Enter the product model without inventing or removing a real variant.
      placeholder: Edition XS
    validations:
      required: true
  - type: input
    id: variant
    attributes:
      label: Variant / revision / pads / mode
      description: Include only when it materially identifies a different physical/acoustic configuration. Leave blank when not applicable or unknown.
  - type: input
    id: creator
    attributes:
      label: EQ creator / username
      description: Use the original author when known.
    validations:
      required: true
  - type: input
    id: original_url
    attributes:
      label: Original source URL
      description: Prefer the creator's original post/file over a mirror or repost.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Source platform
      options:
        - OPRA
        - AutoEq
        - oratory1990
        - Squiglink-compatible source
        - Reddit
        - Head-Fi
        - Audio Science Review
        - HEADPHONE Community
        - GitHub / Gist
        - Topping Community
        - Other
    validations:
      required: true
  - type: input
    id: tuning_name
    attributes:
      label: Preset / tuning name (optional)
      description: Use the source's own name when it provides one, such as Neutral, Warm, Bass, or a version name. Leave blank rather than inventing a name.
  - type: input
    id: target
    attributes:
      label: Target / curve (only if explicitly stated)
      description: Leave blank rather than guessing.
  - type: textarea
    id: sound_impact
    attributes:
      label: Sound impact / intent (optional)
      description: Briefly preserve how the source describes the tuning, such as warmer, reduced treble, stronger sub-bass, or vocal-forward. Do not add claims the source did not make.
  - type: textarea
    id: filters
    attributes:
      label: Parametric EQ / preset data
      description: Paste the source-authored structured filter data exactly, or provide the exact preset-file link. Do not reduce the filter count to fit a device.
      render: text
  - type: input
    id: source_date
    attributes:
      label: Source published / updated date
      description: Optional; use YYYY-MM-DD when known.
  - type: checkboxes
    id: authorship
    attributes:
      label: Authorship
      options:
        - label: I am the creator of this EQ.
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Optional provenance, measurement, revision, or variant context. Do not paste unrelated forum prose.
