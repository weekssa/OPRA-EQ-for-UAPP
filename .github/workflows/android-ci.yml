name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Test exact-candidate release promotion contract
        run: |
          python3 -m unittest discover -s tools -p 'test_promote_release_candidate.py' -v
          python3 tools/promote_release_candidate.py check-contract

      - name: Test qualified beta prerelease publisher contract
        run: |
          python3 tools/test_publish_beta_prerelease.py
          python3 tools/publish_beta_prerelease.py check-contract --project-root .

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: "9.4.1"
          cache-provider: basic

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Upload Android lint reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-lint-reports
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Assemble release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify minified release output
        run: bash tools/verify-r8-mapping.sh

      - name: Upload debug APK for device testing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EQ-Library-beta-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  emulator-ui-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platform-tools

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: "9.4.1"
          cache-provider: basic

      - name: Install emulator image
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "emulator" "system-images;android-35;google_apis;x86_64"
          avd_home="$RUNNER_TEMP/android-avd"
          mkdir -p "$avd_home"
          printf 'ANDROID_AVD_HOME=%s\n' "$avd_home" >> "$GITHUB_ENV"
          ANDROID_AVD_HOME="$avd_home" avdmanager create avd --force --name opra_ci_api_35 --package "system-images;android-35;google_apis;x86_64" --device pixel_6
          test -f "$avd_home/opra_ci_api_35.ini"

      - name: Start emulator
        shell: bash
        run: |
          set -euo pipefail
          sudo chown "$(id -un)" /dev/kvm
          "$ANDROID_SDK_ROOT/emulator/emulator" -accel-check
          nohup "$ANDROID_SDK_ROOT/emulator/emulator" -avd opra_ci_api_35 -no-window -noaudio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator_pid=$!
          for attempt in $(seq 1 60); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/emulator.log"
              exit 1
            fi
            if adb get-state 2>/dev/null | grep -qx device; then
              break
            fi
            if [[ "$attempt" -eq 60 ]]; then
              cat "$RUNNER_TEMP/emulator.log"
              exit 1
            fi
            sleep 2
          done
          boot_completed=""
          for attempt in $(seq 1 48); do
            boot_completed="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [[ "$boot_completed" == "1" ]]; then
              break
            fi
            sleep 5
          done
          if [[ "$boot_completed" != "1" ]]; then
            printf 'API 35 emulator did not finish booting.\n' >&2
            cat "$RUNNER_TEMP/emulator.log"
            exit 1
          fi
          adb shell wm dismiss-keyguard
          adb shell am start -a android.intent.action.MAIN -c android.intent.category.HOME -W
          current_focus=""
          for focus_attempt in $(seq 1 30); do
            current_focus="$(adb shell dumpsys window 2>/dev/null | tr -d '\r' | sed -n 's/.*mCurrentFocus=//p' | head -n 1 || true)"
            if [[ "$current_focus" == *"com.google.android.apps.nexuslauncher"* && "$current_focus" != *"Application Not Responding"* ]]; then
              break
            fi
            sleep 1
          done
          if [[ "$current_focus" != *"com.google.android.apps.nexuslauncher"* || "$current_focus" == *"Application Not Responding"* ]]; then
            printf 'Emulator Home did not acquire window focus after boot. Current focus: %s\n' "$current_focus" >&2
            adb shell dumpsys window >&2
            exit 1
          fi
          printf 'Emulator Home window is focused: %s\n' "$current_focus"

      - name: Enable software keyboard with emulated keyboard
        shell: bash
        run: |
          set -euo pipefail
          avd_config="$ANDROID_AVD_HOME/opra_ci_api_35.avd/config.ini"
          grep '^hw.keyboard=' "$avd_config"
          ime_setting_before="$(adb shell settings get secure show_ime_with_hard_keyboard | tr -d '\r')"
          printf 'show_ime_with_hard_keyboard before=%s\n' "$ime_setting_before"
          adb shell settings put secure show_ime_with_hard_keyboard 1
          ime_setting="$(adb shell settings get secure show_ime_with_hard_keyboard | tr -d '\r')"
          printf 'show_ime_with_hard_keyboard after=%s\n' "$ime_setting"
          test "$ime_setting" = "1"

      - name: Clear emulator logcat before UI tests
        run: adb logcat -c

      - name: Run connected UI tests
        id: connected_ui_tests
        run: gradle :app:connectedDebugAndroidTest --stacktrace

      - name: Capture emulator window state
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          state_file="$RUNNER_TEMP/emulator-ui-state.txt"
          {
            echo "=== adb devices ==="
            adb devices -l
            echo "=== power ==="
            adb shell dumpsys power
            echo "=== window ==="
            adb shell dumpsys window
            echo "=== activities ==="
            adb shell dumpsys activity activities
            echo "=== input ==="
            adb shell dumpsys input
            echo "=== focus logs ==="
            adb logcat -d -s ActivityTaskManager:I WindowManager:I InputDispatcher:I KeyguardViewMediator:I
          } > "$state_file" 2>&1
          tail -n 80 "$state_file" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload emulator diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-emulator-ui-test-reports
          path: |
            ${{ runner.temp }}/emulator.log
            ${{ runner.temp }}/emulator-ui-state.txt
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14

  min-api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platform-tools

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: "9.4.1"
          cache-provider: basic

      - name: Assemble minified release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify minified release output
        run: bash tools/verify-r8-mapping.sh

      - name: Install Android 8.0 emulator image
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "emulator" "system-images;android-26;google_apis;x86_64"
          avd_home="$RUNNER_TEMP/android-avd-api-26"
          mkdir -p "$avd_home"
          printf 'ANDROID_AVD_HOME=%s\n' "$avd_home" >> "$GITHUB_ENV"
          ANDROID_AVD_HOME="$avd_home" avdmanager create avd --force --name opra_ci_api_26 --package "system-images;android-26;google_apis;x86_64" --device pixel_2
          test -f "$avd_home/opra_ci_api_26.ini"

      - name: Start API-26 emulator and cold-install app
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          sudo chown "$(id -un)" /dev/kvm
          "$ANDROID_SDK_ROOT/emulator/emulator" -accel-check
          nohup "$ANDROID_SDK_ROOT/emulator/emulator" -avd opra_ci_api_26 -no-window -noaudio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator-api-26.log" 2>&1 &
          emulator_pid=$!
          for attempt in $(seq 1 60); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/emulator-api-26.log"
              exit 1
            fi
            if adb get-state 2>/dev/null | grep -qx device; then
              break
            fi
            if [[ "$attempt" -eq 60 ]]; then
              cat "$RUNNER_TEMP/emulator-api-26.log"
              exit 1
            fi
            sleep 2
          done
          boot_completed=""
          for attempt in $(seq 1 60); do
            boot_completed="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [[ "$boot_completed" == "1" ]]; then
              break
            fi
            sleep 5
          done
          if [[ "$boot_completed" != "1" ]]; then
            printf 'API 26 emulator did not finish booting.\n' >&2
            cat "$RUNNER_TEMP/emulator-api-26.log"
            exit 1
          fi
          api_level="$(adb shell getprop ro.build.version.sdk | tr -d "\r")"
          printf 'Booted emulator API level: %s\n' "$api_level"
          if [[ "$api_level" != "26" ]]; then
            printf 'Expected API 26 emulator, received API %s.\n' "$api_level" >&2
            exit 1
          fi
          abi="$(adb shell getprop ro.product.cpu.abi | tr -d '\r')"
          if [[ "$abi" != "x86_64" ]]; then
            printf 'Expected the default API-26 x86_64 profile, received ABI %s.\n' "$abi" >&2
            exit 1
          fi
          heap_growth_limit_before="$(adb shell getprop dalvik.vm.heapgrowthlimit | tr -d '\r')"
          if [[ -z "$heap_growth_limit_before" ]]; then
            printf 'API-26 x86_64 image leaves dalvik.vm.heapgrowthlimit unset; applying the required default 48m before app installation.\n'
            adb root
            adb wait-for-device
            shell_uid="$(adb shell id -u | tr -d '\r')"
            if [[ "$shell_uid" != "0" ]]; then
              printf 'Could not obtain root to apply the required API-26 48m runtime default.\n' >&2
              exit 1
            fi
            adb shell stop zygote
            zygote_state=""
            for attempt in $(seq 1 30); do
              zygote_state="$(adb shell getprop init.svc.zygote | tr -d '\r')"
              if [[ "$zygote_state" == "stopped" ]]; then
                break
              fi
              sleep 1
            done
            if [[ "$zygote_state" != "stopped" ]]; then
              printf 'API-26 zygote did not stop before applying the heap-growth limit (state=%s).\n' "$zygote_state" >&2
              exit 1
            fi
            adb shell setprop dalvik.vm.heapgrowthlimit 48m
            adb shell start zygote
            heap_growth_limit=""
            zygote_state=""
            for attempt in $(seq 1 60); do
              heap_growth_limit="$(adb shell getprop dalvik.vm.heapgrowthlimit | tr -d '\r')"
              zygote_state="$(adb shell getprop init.svc.zygote | tr -d '\r')"
              if [[ "$heap_growth_limit" == "48m" && "$zygote_state" == "running" ]]; then
                break
              fi
              sleep 1
            done
            if [[ "$heap_growth_limit" != "48m" || "$zygote_state" != "running" ]]; then
              printf 'Could not establish the required 48m heap-growth limit before app installation (property=%s, zygote=%s).\n' "$heap_growth_limit" "$zygote_state" >&2
              exit 1
            fi
            package_manager_path=""
            for attempt in $(seq 1 60); do
              package_manager_path="$(adb shell pm path android 2>/dev/null | tr -d '\r' || true)"
              if [[ "$package_manager_path" == package:* ]]; then
                break
              fi
              sleep 1
            done
            if [[ "$package_manager_path" != package:* ]]; then
              printf 'Package Manager did not become ready after restarting zygote.\n' >&2
              exit 1
            fi
          else
            package_manager_path='not restarted (heap-growth limit already configured)'
          fi
          heap_growth_limit="$(adb shell getprop dalvik.vm.heapgrowthlimit | tr -d '\r')"
          heap_growth_limit_before_report="$heap_growth_limit_before"
          if [[ -z "$heap_growth_limit_before_report" ]]; then
            heap_growth_limit_before_report='<unset>'
          fi
          printf 'Dalvik heap growth limit before normalization: %s\nDalvik heap growth limit for app launch: %s\nEmulator ABI: %s\nPackage Manager readiness: %s\nZygote state: %s\n' "$heap_growth_limit_before_report" "$heap_growth_limit" "$abi" "$package_manager_path" "$(adb shell getprop init.svc.zygote | tr -d '\r')" | tee "$RUNNER_TEMP/min-api-runtime.txt"
          if [[ "$heap_growth_limit" != "48m" ]]; then
            printf 'Expected the default API-26 x86_64 profile with a 48m heap growth limit.\n' >&2
            exit 1
          fi
          grep -E '^(abi\.type|hw\.device\.name|hw\.ramSize|vm\.heapSize|hw\.keyboard)=' \
            "$ANDROID_AVD_HOME/opra_ci_api_26.avd/config.ini" > "$RUNNER_TEMP/min-api-avd-config.txt"
          release_apks=()
          while IFS= read -r -d '' apk_path; do
            release_apks+=("$apk_path")
          done < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print0)
          if [[ "${#release_apks[@]}" -ne 1 ]]; then
            printf 'Expected exactly one release APK for API-26 smoke install; found %s.\n' "${#release_apks[@]}" >&2
            find app/build/outputs/apk/release -maxdepth 1 -type f -print >&2 || true
            exit 1
          fi
          printf 'Minified release APK: %s\n' "${release_apks[0]}"
          smoke_keystore="$RUNNER_TEMP/api-26-smoke.jks"
          smoke_apk="$RUNNER_TEMP/app-release-api26-smoke.apk"
          trap 'rm -f -- "$smoke_keystore" "$smoke_apk"' EXIT
          keytool -genkeypair -noprompt \
            -alias api-26-smoke \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -dname 'CN=EQ Library API 26 smoke only' \
            -storetype JKS \
            -keystore "$smoke_keystore" \
            -storepass android \
            -keypass android
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" sign \
            --ks "$smoke_keystore" \
            --ks-key-alias api-26-smoke \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$smoke_apk" \
            "${release_apks[0]}"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose "$smoke_apk"
          adb install "$smoke_apk"
          # The emulator is freshly wiped and this app has not launched in this job; preserve
          # its clean log baseline without depending on logcat buffer-clear permissions.
          launch_output="$(adb shell am start -W -n com.weekssa.opraeqforuapp/.MainActivity 2>&1)"
          printf '%s\n' "$launch_output" | tee "$RUNNER_TEMP/min-api-launch.txt"
          grep -q '^Status: ok$' "$RUNNER_TEMP/min-api-launch.txt"
          adb logcat -b all -v threadtime > "$RUNNER_TEMP/min-api-logcat-threadtime.txt" 2>&1 &
          logcat_pid=$!
          trap 'kill "$logcat_pid" 2>/dev/null || true' EXIT
          tab_deadline=$((SECONDS + 60))
          while (( SECONDS < tab_deadline )); do
            adb shell uiautomator dump /sdcard/window.xml > /dev/null 2>&1 || true
            if adb shell cat /sdcard/window.xml 2>/dev/null | grep -q 'text="EQ Library"'; then
              break
            fi
            sleep 5
          done
          if ! adb shell cat /sdcard/window.xml 2>/dev/null | grep -q 'text="EQ Library"'; then
            adb shell cat /sdcard/window.xml > "$RUNNER_TEMP/min-api-hierarchy.xml" 2>/dev/null || true
            printf 'EQ Library navigation tab did not appear within 60 seconds.\n' >&2
            exit 1
          fi
          adb shell cat /sdcard/window.xml > "$RUNNER_TEMP/min-api-hierarchy.xml"
          tap="$(python3 - "$RUNNER_TEMP/min-api-hierarchy.xml" <<'PY'
          import re
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          candidates = []
          for node in root.iter("node"):
              if node.attrib.get("text") != "EQ Library":
                  continue
              match = re.fullmatch(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", node.attrib.get("bounds", ""))
              if match:
                  left, top, right, bottom = map(int, match.groups())
                  candidates.append(((left + right) // 2, (top + bottom) // 2))
          if not candidates:
              raise SystemExit("The visible EQ Library navigation control has no bounds.")
          print(*max(candidates, key=lambda point: point[1]))
          PY
          )"
          read -r tap_x tap_y <<< "$tap"
          printf 'Tapping visible EQ Library navigation control at %s,%s.\n' "$tap_x" "$tap_y"
          adb exec-out screencap -p > "$RUNNER_TEMP/min-api-before-library.png"
          adb shell dumpsys meminfo com.weekssa.opraeqforuapp > "$RUNNER_TEMP/min-api-meminfo-before-library.txt"
          adb shell input tap "$tap_x" "$tap_y"
          readiness_deadline=$((SECONDS + 300))
          catalog_ready=false
          while (( SECONDS < readiness_deadline )); do
            if ! adb shell pidof com.weekssa.opraeqforuapp > "$RUNNER_TEMP/min-api-pid.txt"; then
              adb shell uiautomator dump /sdcard/window.xml > /dev/null 2>&1 || true
              adb shell cat /sdcard/window.xml > "$RUNNER_TEMP/min-api-hierarchy.xml" 2>/dev/null || true
              adb exec-out screencap -p > "$RUNNER_TEMP/min-api-library.png" 2>/dev/null || true
              adb shell dumpsys meminfo com.weekssa.opraeqforuapp > "$RUNNER_TEMP/min-api-meminfo.txt" 2>&1 || true
              adb logcat -d -v brief -s AndroidRuntime:E > "$RUNNER_TEMP/min-api-logcat.txt"
              cat "$RUNNER_TEMP/min-api-logcat.txt"
              printf 'App process exited before the EQ catalog became ready.\n' >&2
              exit 1
            fi
            adb shell uiautomator dump /sdcard/window.xml > /dev/null 2>&1 || true
            if adb shell cat /sdcard/window.xml 2>/dev/null | grep -q 'text="Manufacturers"' && \
              adb shell cat /sdcard/window.xml 2>/dev/null | grep -q 'text="1Custom"'; then
              catalog_ready=true
              adb shell cat /sdcard/window.xml > "$RUNNER_TEMP/min-api-hierarchy.xml"
              adb exec-out screencap -p > "$RUNNER_TEMP/min-api-library.png"
              adb shell dumpsys meminfo com.weekssa.opraeqforuapp > "$RUNNER_TEMP/min-api-meminfo.txt"
              break
            fi
            adb logcat -d -v brief -s AndroidRuntime:E > "$RUNNER_TEMP/min-api-logcat.txt"
            if grep -Fq 'Process: com.weekssa.opraeqforuapp' "$RUNNER_TEMP/min-api-logcat.txt"; then
              cat "$RUNNER_TEMP/min-api-logcat.txt"
              exit 1
            fi
            sleep 5
          done
          if [[ "$catalog_ready" != true ]]; then
            adb shell cat /sdcard/window.xml > "$RUNNER_TEMP/min-api-hierarchy.xml" 2>/dev/null || true
            adb exec-out screencap -p > "$RUNNER_TEMP/min-api-library.png" 2>/dev/null || true
            adb shell dumpsys meminfo com.weekssa.opraeqforuapp > "$RUNNER_TEMP/min-api-meminfo.txt" 2>&1 || true
            printf 'EQ catalog did not show its Manufacturers heading and populated 1Custom row within 300 seconds.\n' >&2
            exit 1
          fi
          printf 'EQ catalog showed the Manufacturers heading and the 1Custom row after Library navigation.\n' | tee "$RUNNER_TEMP/min-api-catalog-ready.txt"
          pid_before="$(adb shell pidof com.weekssa.opraeqforuapp | tr -d '\r')"
          printf '%s\n' "$pid_before" | tee "$RUNNER_TEMP/min-api-pid-before-observation.txt"
          test -n "$pid_before"
          adb shell dumpsys activity activities > "$RUNNER_TEMP/min-api-activities.txt"
          grep -E 'ResumedActivity|mResumedActivity' "$RUNNER_TEMP/min-api-activities.txt" | grep -F 'com.weekssa.opraeqforuapp'
          sleep 60
          pid_after="$(adb shell pidof com.weekssa.opraeqforuapp | tr -d '\r')"
          printf '%s\n' "$pid_after" | tee "$RUNNER_TEMP/min-api-pid-after-observation.txt"
          if [[ "$pid_after" != "$pid_before" ]]; then
            printf 'App process changed during the 60-second populated-Library observation.\n' >&2
            exit 1
          fi
          adb shell dumpsys activity activities > "$RUNNER_TEMP/min-api-activities.txt"
          grep -E 'ResumedActivity|mResumedActivity' "$RUNNER_TEMP/min-api-activities.txt" | grep -F 'com.weekssa.opraeqforuapp'
          kill "$logcat_pid" 2>/dev/null || true
          wait "$logcat_pid" 2>/dev/null || true
          adb logcat -d -v brief -s AndroidRuntime:E > "$RUNNER_TEMP/min-api-logcat.txt"
          if grep -Fq 'Process: com.weekssa.opraeqforuapp' "$RUNNER_TEMP/min-api-logcat.txt"; then
            cat "$RUNNER_TEMP/min-api-logcat.txt"
            exit 1
          fi

      - name: Upload API-26 smoke diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-api-26-smoke-reports
          path: |
            ${{ runner.temp }}/emulator-api-26.log
            ${{ runner.temp }}/min-api-launch.txt
            ${{ runner.temp }}/min-api-pid.txt
            ${{ runner.temp }}/min-api-catalog-ready.txt
            ${{ runner.temp }}/min-api-activities.txt
            ${{ runner.temp }}/min-api-hierarchy.xml
            ${{ runner.temp }}/min-api-runtime.txt
            ${{ runner.temp }}/min-api-avd-config.txt
            ${{ runner.temp }}/min-api-meminfo.txt
            ${{ runner.temp }}/min-api-meminfo-before-library.txt
