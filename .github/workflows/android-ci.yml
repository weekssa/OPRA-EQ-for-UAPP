name: Android CI & Unlazy Quality Gates

on:
  push:
    branches: [ main, "feature/**", "codex/**" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Set up Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Global Skills CLI Tool
      run: npm install -g skills

    - name: Setup Mock Gradle Executables
      run: |
        chmod +x gradlew

    - name: Run Unlazy Strict Quality Gates
      run: |
        node -e "
        const fs = require('fs');
        const path = require('path');
        const skillPath = path.join(process.env.HOME, '.agents/skills/unlazy/scripts');
        fs.mkdirSync(skillPath, { recursive: true });
        "
        npx skills add Leonxlnx/unlazy -g --all
        node ~/.agents/skills/unlazy/scripts/gate-check.mjs --reverify GATES.md
