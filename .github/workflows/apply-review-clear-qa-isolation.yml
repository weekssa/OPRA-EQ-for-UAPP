name: Apply review-clear QA isolation

on:
  push:
    branches:
      - v0.3-review-clear-qa

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.3-review-clear-qa
          fetch-depth: 0
      - name: Patch QA-only catalog isolation
        shell: python
        run: |
          from pathlib import Path

          main = Path("app/src/main/java/com/weekssa/opraeqforuapp/MainActivity.kt")
          text = main.read_text()

          old = "        BackgroundSyncScheduler.ensureScheduled(applicationContext)\n"
          new = "        val reviewClearQa = application is QaReviewApplication\n        if (!reviewClearQa) BackgroundSyncScheduler.ensureScheduled(applicationContext)\n"
          assert text.count(old) == 1, "BackgroundSyncScheduler pattern changed"
          text = text.replace(old, new, 1)

          old = "            if (ready != null) {\n                managedHeadphonesRepository.reconcileCatalog(ready.catalog)\n            }\n"
          new = "            if (!reviewClearQa && ready != null) {\n                managedHeadphonesRepository.reconcileCatalog(ready.catalog)\n            }\n"
          assert text.count(old) == 1, "initial reconcile pattern changed"
          text = text.replace(old, new, 1)

          old = "    private suspend fun refreshCatalogIfDue() {\n        val ready = catalogRepository.state.value as? CatalogState.Ready ?: return\n"
          new = "    private suspend fun refreshCatalogIfDue() {\n        if (application is QaReviewApplication) return\n        val ready = catalogRepository.state.value as? CatalogState.Ready ?: return\n"
          assert text.count(old) == 1, "refreshCatalogIfDue pattern changed"
          text = text.replace(old, new, 1)
          main.write_text(text)

          qa = Path("app/src/main/java/com/weekssa/opraeqforuapp/QaReviewApplication.kt")
          q = qa.read_text()
          old = "import android.app.Application\n"
          new = "import android.app.Application\nimport androidx.work.WorkManager\n"
          assert q.count(old) == 1, "QaReviewApplication import pattern changed"
          q = q.replace(old, new, 1)
          old = "        super.onCreate()\n        runBlocking(Dispatchers.IO) {\n"
          new = "        super.onCreate()\n        WorkManager.getInstance(this).cancelAllWork()\n        runBlocking(Dispatchers.IO) {\n"
          assert q.count(old) == 1, "QaReviewApplication onCreate pattern changed"
          q = q.replace(old, new, 1)
          qa.write_text(q)
      - name: Remove one-shot helper
        run: git rm .github/workflows/apply-review-clear-qa-isolation.yml
      - name: Commit QA isolation fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/weekssa/opraeqforuapp/MainActivity.kt app/src/main/java/com/weekssa/opraeqforuapp/QaReviewApplication.kt
          git commit -m "QA: keep review fixture pending until Done"
          git push origin HEAD:v0.3-review-clear-qa
