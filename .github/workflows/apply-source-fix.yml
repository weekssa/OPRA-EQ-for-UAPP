name: Apply retained-profile source fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Apply source fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/weekssa/opraeqforuapp/data/managed/ManagedHeadphonesRepository.kt')
          text = path.read_text()
          old = 'dao.countSelectedProfiles(productId)'
          new = 'dao.countProfiles(productId)'
          if old in text:
              path.write_text(text.replace(old, new))
          elif new not in text:
              raise SystemExit('Expected retained-profile cleanup call not found')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/weekssa/opraeqforuapp/data/managed/ManagedHeadphonesRepository.kt
          if git diff --cached --quiet; then
            echo 'Source fix already applied.'
            exit 0
          fi
          git commit -m 'Fix retained profile cleanup compile error'
          git push origin HEAD:main
