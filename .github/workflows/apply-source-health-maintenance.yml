name: Apply source health maintenance

on:
  push:
    branches:
      - source-health-currentness
    paths:
      - '.github/workflows/apply-source-health-maintenance.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: source-health-currentness
          fetch-depth: 1

      - name: Stop blocked oratory Reddit polling
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/catalog-currentness.yml')
          text = path.read_text(encoding='utf-8')
          old = '''      - name: Discover latest direct oratory update metadata
        run: >-
          python3 tools/oratory_update_discovery.py
          --fetch-url 'https://www.reddit.com/r/oratory1990/new.json?limit=100&raw_json=1'
          --output "${RUNNER_TEMP}/oratory-updates.json"
          --allow-degraded
'''
          new = '''      - name: Retain curated oratory update metadata
        run: |
          cp catalog/discovery/oratory_updates.json "${RUNNER_TEMP}/oratory-updates.json"
          echo "oratory1990 direct update discovery is manual while anonymous Reddit JSON access is blocked." >> "${GITHUB_STEP_SUMMARY}"
'''
          if text.count(old) != 1:
              raise SystemExit('expected exactly one scheduled oratory Reddit polling step')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Validate workflow edit
        run: |
          ! grep -q 'www.reddit.com/r/oratory1990/new.json' .github/workflows/catalog-currentness.yml
          grep -q 'Retain curated oratory update metadata' .github/workflows/catalog-currentness.yml

      - name: Commit maintenance patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/catalog-currentness.yml
          git commit -m "Stop blocked oratory Reddit polling"
          git push origin HEAD:source-health-currentness
