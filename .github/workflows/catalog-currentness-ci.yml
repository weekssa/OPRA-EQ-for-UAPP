name: Catalog currentness CI

on:
  push:
    branches:
      - eq-library-community-v0.3
    paths:
      - 'config/source_registry.json'
      - 'tools/catalog_pipeline.py'
      - 'tools/test_catalog_pipeline.py'
      - '.github/workflows/catalog-currentness-ci.yml'
  pull_request:
    paths:
      - 'config/source_registry.json'
      - 'tools/catalog_pipeline.py'
      - 'tools/test_catalog_pipeline.py'
      - '.github/workflows/catalog-currentness-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source registry
        run: python tools/catalog_pipeline.py validate-registry --registry config/source_registry.json
      - name: Reconcile source-health state in a temporary file
        run: python tools/catalog_pipeline.py reconcile-health --registry config/source_registry.json --state "${RUNNER_TEMP}/source_health.json"
      - name: Unit tests
        run: python -m unittest discover -s tools -p 'test_*.py' -v
