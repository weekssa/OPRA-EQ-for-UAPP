name: Catalog currentness CI

on:
  push:
    branches:
      - eq-library-community-v0.3
    paths:
      - 'catalog/catalog.json'
      - 'catalog/source_health.json'
      - 'config/source_registry.json'
      - 'config/qualified_github_sources.json'
      - 'config/headphone_identity_decisions.json'
      - 'config/immutable_revision_seeds.json'
      - 'tools/acoustic_fingerprint.py'
      - 'tools/catalog_pipeline.py'
      - 'tools/catalog_merge.py'
      - 'tools/catalog_history_repair.py'
      - 'tools/currentness_scheduler.py'
      - 'tools/autoeq_ingest.py'
      - 'tools/autoeq_currentness.py'
      - 'tools/autoeq_corpus_ingest.py'
      - 'tools/community_peq_ingest.py'
      - 'tools/github_preset_discovery.py'
      - 'tools/headphone_identity_audit.py'
      - 'tools/headphone_identity_decisions.py'
      - 'tools/qualified_github_ingest.py'
      - 'tools/squiglink_discovery.py'
      - 'tools/oratory_provenance.py'
      - 'tools/oratory_update_discovery.py'
      - 'tools/test_*.py'
      - '.github/workflows/catalog-currentness-ci.yml'
      - '.github/workflows/catalog-currentness.yml'
      - '.github/workflows/headphone-identity-decisions.yml'
  pull_request:
    paths:
      - 'catalog/catalog.json'
      - 'catalog/source_health.json'
      - 'config/source_registry.json'
      - 'config/qualified_github_sources.json'
      - 'config/headphone_identity_decisions.json'
      - 'config/immutable_revision_seeds.json'
      - 'tools/acoustic_fingerprint.py'
      - 'tools/catalog_pipeline.py'
      - 'tools/catalog_merge.py'
      - 'tools/catalog_history_repair.py'
      - 'tools/currentness_scheduler.py'
      - 'tools/autoeq_ingest.py'
      - 'tools/autoeq_currentness.py'
      - 'tools/autoeq_corpus_ingest.py'
      - 'tools/community_peq_ingest.py'
      - 'tools/github_preset_discovery.py'
      - 'tools/headphone_identity_audit.py'
      - 'tools/headphone_identity_decisions.py'
      - 'tools/qualified_github_ingest.py'
      - 'tools/squiglink_discovery.py'
      - 'tools/oratory_provenance.py'
      - 'tools/oratory_update_discovery.py'
      - 'tools/test_*.py'
      - '.github/workflows/catalog-currentness-ci.yml'
      - '.github/workflows/catalog-currentness.yml'
      - '.github/workflows/headphone-identity-decisions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Show Python runtime
        run: python3 --version
      - name: Validate source registry
        run: python3 tools/catalog_pipeline.py validate-registry --registry config/source_registry.json
      - name: Validate reviewed headphone identity decisions
        run: python3 tools/headphone_identity_decisions.py validate --decisions config/headphone_identity_decisions.json
      - name: Validate published catalog and LKG publication
        run: >-
          python3 tools/catalog_pipeline.py publish
          --candidate catalog/catalog.json
          --published "${RUNNER_TEMP}/published.json"
          --last-known-good "${RUNNER_TEMP}/catalog.last-known-good.json"
      - name: Restore reviewed immutable catalog history in CI workspace
        run: |
          python3 tools/catalog_history_repair.py \
            --catalog catalog/catalog.json \
            --seeds config/immutable_revision_seeds.json \
            --output "${RUNNER_TEMP}/catalog.history-restored.json" \
            --report "${RUNNER_TEMP}/catalog-history-repair.json"
          cp "${RUNNER_TEMP}/catalog.history-restored.json" catalog/catalog.json
      - name: Reconcile source-health state in a temporary file
        run: cp catalog/source_health.json "${RUNNER_TEMP}/source_health.json" && python3 tools/catalog_pipeline.py reconcile-health --registry config/source_registry.json --state "${RUNNER_TEMP}/source_health.json"
      - name: Build deterministic currentness plan
        run: >-
          python3 tools/currentness_scheduler.py
          --registry config/source_registry.json
          --state "${RUNNER_TEMP}/source_health.json"
          --now 2026-08-29T15:00:00Z
          --last-discovery-at 2026-08-20T15:00:00Z
      - name: Run all external catalog unit tests
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Audit current OPRA headphone identity
        run: |
          python3 tools/headphone_identity_audit.py \
            --catalog catalog/catalog.json \
            --decisions config/headphone_identity_decisions.json \
            --output "${RUNNER_TEMP}/headphone-identity-audit.json"
          python3 - <<'PY'
          import json, os
          path = os.environ['RUNNER_TEMP'] + '/headphone-identity-audit.json'
          report = json.load(open(path, encoding='utf-8'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## Headphone identity audit\n\n')
              summary.write(f"- OPRA products scanned: {report['product_count']}\n")
              summary.write(f"- auto-safe identity groups: {report['auto_safe_group_count']}\n")
              summary.write(f"- explicit alias pairs already covered: {report['covered_explicit_alias_pair_count']}\n")
              summary.write(f"- confirmed-distinct pairs suppressed: {report['confirmed_distinct_pair_count']}\n")
              summary.write(f"- candidates queued for review: {report['review_candidate_count']}\n")
          PY
      - name: Upload headphone identity audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: headphone-identity-audit-${{ github.sha }}
          path: ${{ runner.temp }}/headphone-identity-audit.json
          if-no-files-found: error
          retention-days: 14
      - name: Fetch qualified AutoEq structured corpus
        run: |
          AUTOEQ_ROOT="${RUNNER_TEMP}/autoeq-upstream"
          git clone --depth=1 --filter=blob:none --no-checkout https://github.com/jaakkopasanen/AutoEq.git "${AUTOEQ_ROOT}"
          git -C "${AUTOEQ_ROOT}" sparse-checkout init --no-cone
          cat > "${AUTOEQ_ROOT}/.git/info/sparse-checkout" <<'EOF'
          /dbtools/manufacturers.tsv
          /results/**/* ParametricEQ.txt
          EOF
          git -C "${AUTOEQ_ROOT}" checkout master
          test -f "${AUTOEQ_ROOT}/dbtools/manufacturers.tsv"
          test "$(find "${AUTOEQ_ROOT}/results" -type f -name '* ParametricEQ.txt' | wc -l)" -gt 1000
      - name: Exercise live qualified AutoEq corpus without publishing
        run: >-
          python3 tools/autoeq_corpus_ingest.py
          --autoeq-root "${RUNNER_TEMP}/autoeq-upstream"
          --catalog catalog/catalog.json
          --registry config/source_registry.json
          --health catalog/source_health.json
          --catalog-output "${RUNNER_TEMP}/catalog.autoeq.json"
          --health-output "${RUNNER_TEMP}/source_health.autoeq.json"
          --report "${RUNNER_TEMP}/autoeq-corpus-report.json"
      - name: Summarize AutoEq corpus validation
        run: |
          python3 - <<'PY'
          import json, os
          report = json.load(open(os.environ['RUNNER_TEMP'] + '/autoeq-corpus-report.json', encoding='utf-8'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## AutoEq corpus\n\n')
              for key in ('preset_file_count', 'candidate_count', 'unknown_manufacturer_count', 'parse_failure_count', 'profile_count', 'compact_catalog_bytes', 'pretty_catalog_bytes'):
                  if key in report:
                      summary.write(f"- {key}: {report[key]}\n")
          PY
      - name: Exercise live explicitly qualified GitHub sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/qualified_github_ingest.py \
            --catalog "${RUNNER_TEMP}/catalog.autoeq.json" \
            --registry config/source_registry.json \
            --health "${RUNNER_TEMP}/source_health.autoeq.json" \
            --manifest config/qualified_github_sources.json \
            --catalog-output "${RUNNER_TEMP}/catalog.github.json" \
            --health-output "${RUNNER_TEMP}/source_health.candidate.json" \
            --report "${RUNNER_TEMP}/qualified-github-report.json" \
            --github-token "${GITHUB_TOKEN}"
          python3 - <<'PY'
          import json, os
          path = os.environ['RUNNER_TEMP'] + '/qualified-github-report.json'
          report = json.load(open(path, encoding='utf-8'))
          degraded = [item for item in report if item.get('status') != 'ok']
          if degraded:
              raise SystemExit('qualified GitHub live source degraded: ' + json.dumps(degraded, sort_keys=True))
          PY
      - name: Enrich qualified presets with direct oratory creator provenance
        run: >-
          python3 tools/oratory_provenance.py
          --catalog "${RUNNER_TEMP}/catalog.github.json"
          --output "${RUNNER_TEMP}/catalog.preidentity.json"
          --report "${RUNNER_TEMP}/oratory-provenance.json"
      - name: Reapply reviewed headphone identity decisions
        run: >-
          python3 tools/headphone_identity_decisions.py apply
          --decisions config/headphone_identity_decisions.json
          --catalog "${RUNNER_TEMP}/catalog.preidentity.json"
          --output "${RUNNER_TEMP}/catalog.candidate.json"
      - name: Validate refreshed candidate atomically
        run: >-
          python3 tools/catalog_pipeline.py publish
          --candidate "${RUNNER_TEMP}/catalog.candidate.json"
          --published "${RUNNER_TEMP}/refreshed-published.json"
          --last-known-good "${RUNNER_TEMP}/refreshed-lkg.json"
      - name: Upload AutoEq corpus validation report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: autoeq-corpus-report-${{ github.sha }}
          path: ${{ runner.temp }}/autoeq-corpus-report.json
          if-no-files-found: error
          retention-days: 14
