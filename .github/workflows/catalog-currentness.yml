name: EQ catalog currentness

on:
  push:
    branches:
      - eq-library-community-v0.3
    paths:
      - '.github/workflows/catalog-currentness.yml'
      - 'catalog/catalog.json'
      - 'catalog/source_health.json'
      - 'config/source_registry.json'
      - 'config/qualified_github_sources.json'
      - 'config/headphone_identity_decisions.json'
      - 'config/immutable_revision_seeds.json'
      - 'tools/autoeq_currentness.py'
      - 'tools/autoeq_ingest.py'
      - 'tools/autoeq_corpus_ingest.py'
      - 'tools/catalog_history_repair.py'
      - 'tools/catalog_merge.py'
      - 'tools/catalog_pipeline.py'
      - 'tools/currentness_scheduler.py'
      - 'tools/github_preset_discovery.py'
      - 'tools/headphone_identity_audit.py'
      - 'tools/headphone_identity_decisions.py'
      - 'tools/qualified_github_ingest.py'
      - 'tools/oratory_provenance.py'
      - 'tools/oratory_update_discovery.py'
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: write

concurrency:
  group: eq-catalog-writer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out current branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - name: Show currentness mode
        run: |
          echo "event=${GITHUB_EVENT_NAME} ref=${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" && "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "Scheduled publication is only supported from main." >&2
            exit 1
          fi
      - name: Validate registry and current published snapshot
        run: |
          python3 tools/catalog_pipeline.py validate-registry --registry config/source_registry.json
          python3 tools/headphone_identity_decisions.py validate --decisions config/headphone_identity_decisions.json
          python3 tools/catalog_pipeline.py publish \
            --candidate catalog/catalog.json \
            --published "${RUNNER_TEMP}/baseline-published.json" \
            --last-known-good "${RUNNER_TEMP}/baseline-lkg.json"
      - name: Restore reviewed immutable catalog history
        run: >-
          python3 tools/catalog_history_repair.py
          --catalog catalog/catalog.json
          --seeds config/immutable_revision_seeds.json
          --output "${RUNNER_TEMP}/catalog.history-restored.json"
          --report "${RUNNER_TEMP}/catalog-history-repair.json"
      - name: Build currentness plan
        run: >-
          python3 tools/currentness_scheduler.py
          --registry config/source_registry.json
          --state catalog/source_health.json
          > "${RUNNER_TEMP}/currentness-plan.json"
      - name: Fetch qualified AutoEq structured corpus
        run: |
          AUTOEQ_ROOT="${RUNNER_TEMP}/autoeq-upstream"
          git clone --depth=1 --filter=blob:none --no-checkout https://github.com/jaakkopasanen/AutoEq.git "${AUTOEQ_ROOT}"
          git -C "${AUTOEQ_ROOT}" sparse-checkout init --no-cone
          cat > "${AUTOEQ_ROOT}/.git/info/sparse-checkout" <<'EOF'
          /dbtools/manufacturers.tsv
          /results/**/* ParametricEQ.txt
          EOF
          git -C "${AUTOEQ_ROOT}" checkout master
          test -f "${AUTOEQ_ROOT}/dbtools/manufacturers.tsv"
          test "$(find "${AUTOEQ_ROOT}/results" -type f -name '* ParametricEQ.txt' | wc -l)" -gt 1000
      - name: Refresh qualified AutoEq corpus incrementally
        run: >-
          python3 tools/autoeq_corpus_ingest.py
          --autoeq-root "${RUNNER_TEMP}/autoeq-upstream"
          --catalog "${RUNNER_TEMP}/catalog.history-restored.json"
          --registry config/source_registry.json
          --health catalog/source_health.json
          --catalog-output "${RUNNER_TEMP}/catalog.autoeq.json"
          --health-output "${RUNNER_TEMP}/source_health.autoeq.json"
          --report "${RUNNER_TEMP}/autoeq-corpus-report.json"
      - name: Refresh explicitly qualified GitHub sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/qualified_github_ingest.py
          --catalog "${RUNNER_TEMP}/catalog.autoeq.json"
          --registry config/source_registry.json
          --health "${RUNNER_TEMP}/source_health.autoeq.json"
          --manifest config/qualified_github_sources.json
          --catalog-output "${RUNNER_TEMP}/catalog.github.json"
          --health-output "${RUNNER_TEMP}/source_health.candidate.json"
          --report "${RUNNER_TEMP}/qualified-github-report.json"
          --github-token "${GITHUB_TOKEN}"
      - name: Enrich OPRA-carried oratory presets with direct creator provenance
        run: >-
          python3 tools/oratory_provenance.py
          --catalog "${RUNNER_TEMP}/catalog.github.json"
          --output "${RUNNER_TEMP}/catalog.preidentity.json"
          --report "${RUNNER_TEMP}/oratory-provenance.json"
      - name: Reapply reviewed headphone identity decisions
        run: >-
          python3 tools/headphone_identity_decisions.py apply
          --decisions config/headphone_identity_decisions.json
          --catalog "${RUNNER_TEMP}/catalog.preidentity.json"
          --output "${RUNNER_TEMP}/catalog.candidate.json"
      - name: Discover latest direct oratory update metadata
        run: >-
          python3 tools/oratory_update_discovery.py
          --fetch-url 'https://www.reddit.com/r/oratory1990/new.json?limit=100&raw_json=1'
          --output "${RUNNER_TEMP}/oratory-updates.json"
          --allow-degraded
      - name: Validate candidate with atomic last-known-good publication
        run: >-
          python3 tools/catalog_pipeline.py publish
          --candidate "${RUNNER_TEMP}/catalog.candidate.json"
          --published "${RUNNER_TEMP}/validated-catalog.json"
          --last-known-good "${RUNNER_TEMP}/validated-lkg.json"
      - name: Prepare Android transport and readable repository catalogs
        run: |
          python3 - <<'PY'
          import json, os
          transport = os.environ['RUNNER_TEMP'] + '/validated-catalog.json'
          repository = os.environ['RUNNER_TEMP'] + '/repository-catalog.json'
          with open(transport, encoding='utf-8') as handle:
              payload = json.load(handle)
          compact = json.dumps(payload, sort_keys=True, separators=(',', ':'), ensure_ascii=False) + '\n'
          size = len(compact.encode('utf-8'))
          limit = 60 * 1024 * 1024
          if size > limit:
              raise SystemExit(f'validated catalog exceeds transport safety limit: {size} > {limit}')
          with open(transport, 'w', encoding='utf-8') as handle:
              handle.write(compact)
          with open(repository, 'w', encoding='utf-8') as handle:
              handle.write(json.dumps(payload, sort_keys=True, indent=2, ensure_ascii=False) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f'## Catalog transport\n\n- compact bytes: {size}\n- safety limit: {limit}\n')
          PY
      - name: Audit full OPRA identity against validated candidate
        run: >-
          python3 tools/headphone_identity_audit.py
          --catalog "${RUNNER_TEMP}/validated-catalog.json"
          --decisions config/headphone_identity_decisions.json
          --output "${RUNNER_TEMP}/headphone-identity-audit.json"
      - name: Discover public GitHub structured-EQ candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          query = urllib.parse.urlencode({'q': 'ParametricEQ.txt in:path', 'per_page': 50})
          request = urllib.request.Request(
              'https://api.github.com/search/code?' + query,
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
                  'User-Agent': 'EQ-Library-currentness/0.3',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.loads(response.read().decode('utf-8'))
          with open(os.environ['RUNNER_TEMP'] + '/github-code-search.json', 'w', encoding='utf-8') as handle:
              json.dump(payload, handle)
          PY
          python3 tools/github_preset_discovery.py \
            "${RUNNER_TEMP}/github-code-search.json" \
            --kind code-search \
            --output "${RUNNER_TEMP}/github-candidates.json"
      - name: Stage validated persistent currentness outputs
        if: >-
          (github.event_name == 'schedule' && github.ref_name == 'main') ||
          (github.event_name == 'push' && github.ref_name == 'eq-library-community-v0.3')
        run: |
          cp "${RUNNER_TEMP}/repository-catalog.json" catalog/catalog.json
          cp "${RUNNER_TEMP}/source_health.candidate.json" catalog/source_health.json
          mkdir -p catalog/discovery
          cp "${RUNNER_TEMP}/github-candidates.json" catalog/discovery/github_candidates.json
          cp "${RUNNER_TEMP}/oratory-updates.json" catalog/discovery/oratory_updates.json
          cp "${RUNNER_TEMP}/headphone-identity-audit.json" catalog/discovery/headphone_identity_audit.json
      - name: Commit validated currentness changes
        if: >-
          (github.event_name == 'schedule' && github.ref_name == 'main') ||
          (github.event_name == 'push' && github.ref_name == 'eq-library-community-v0.3')
        run: |
          set -euo pipefail
          if git diff --quiet -- catalog/catalog.json catalog/source_health.json catalog/discovery/github_candidates.json catalog/discovery/oratory_updates.json catalog/discovery/headphone_identity_audit.json; then
            echo "No persistent currentness changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add catalog/catalog.json catalog/source_health.json catalog/discovery/github_candidates.json catalog/discovery/oratory_updates.json catalog/discovery/headphone_identity_audit.json
            git commit -m "Refresh EQ catalog currentness"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Publish validated catalog to stable Android branch
        if: github.ref_name == 'main'
        shell: bash
        run: |
          set -euo pipefail
          publish_dir="$(mktemp -d)"
          git fetch origin catalog-live
          git worktree add --detach "$publish_dir" origin/catalog-live
          cp "${RUNNER_TEMP}/validated-catalog.json" "$publish_dir/catalog/catalog.json"
          cd "$publish_dir"
          if git diff --quiet -- catalog/catalog.json; then
            echo "Stable live catalog already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/catalog.json
          git commit -m "Publish validated canonical catalog"
          git push origin HEAD:catalog-live
      - name: Upload currentness validation artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eq-catalog-currentness-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/currentness-plan.json
            ${{ runner.temp }}/catalog-history-repair.json
            ${{ runner.temp }}/validated-catalog.json
            ${{ runner.temp }}/validated-lkg.json
            ${{ runner.temp }}/source_health.candidate.json
            ${{ runner.temp }}/autoeq-corpus-report.json
            ${{ runner.temp }}/qualified-github-report.json
            ${{ runner.temp }}/github-candidates.json
            ${{ runner.temp }}/headphone-identity-audit.json
            ${{ runner.temp }}/oratory-provenance.json
            ${{ runner.temp }}/oratory-updates.json
          retention-days: 14
