name: Community EQ currentness

on:
  push:
    branches:
      - eq-library-community-v0.3
    paths:
      - '.github/workflows/community-currentness.yml'
      - 'tools/community_publish_entry.py'
      - 'tools/curated_community_publish.py'
      - 'tools/community_peq_ingest.py'
      - 'tools/catalog_merge.py'
      - 'catalog/discovery/*_community_curated.json'
      - 'config/source_registry.json'
  workflow_dispatch:
  schedule:
    - cron: '43 10 * * *'

permissions:
  contents: write

concurrency:
  group: eq-catalog-writer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-community:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out current branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Validate current source registry
        run: python3 tools/catalog_pipeline.py validate-registry --registry config/source_registry.json

      - name: Publish all curated community PEQ candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/community-reports"
          cp catalog/catalog.json "${RUNNER_TEMP}/catalog.community.current.json"

          mapfile -t curated_files < <(
            find catalog/discovery -maxdepth 1 -type f -name '*_community_curated.json' -print | sort
          )
          if (( ${#curated_files[@]} == 0 )); then
            echo "No curated community inputs found."
            exit 1
          fi

          for curated in "${curated_files[@]}"; do
            base="$(basename "${curated}" .json)"
            next="${RUNNER_TEMP}/catalog.community.next.json"
            report="${RUNNER_TEMP}/community-reports/${base}-report.json"
            echo "Publishing ${curated}"
            python3 tools/community_publish_entry.py \
              --catalog "${RUNNER_TEMP}/catalog.community.current.json" \
              --curated "${curated}" \
              --registry config/source_registry.json \
              --output "${next}" \
              --report "${report}"
            mv "${next}" "${RUNNER_TEMP}/catalog.community.current.json"
          done

          mv "${RUNNER_TEMP}/catalog.community.current.json" "${RUNNER_TEMP}/catalog.community.json"

      - name: Validate candidate atomically
        run: >-
          python3 tools/catalog_pipeline.py publish
          --candidate "${RUNNER_TEMP}/catalog.community.json"
          --published "${RUNNER_TEMP}/validated-community-catalog.json"
          --last-known-good "${RUNNER_TEMP}/validated-community-lkg.json"

      - name: Minify Android transport catalog
        run: |
          python3 - <<'PY'
          import json, os
          path = os.environ['RUNNER_TEMP'] + '/validated-community-catalog.json'
          with open(path, encoding='utf-8') as handle:
              payload = json.load(handle)
          rendered = json.dumps(payload, sort_keys=True, separators=(',', ':'), ensure_ascii=False) + '\n'
          with open(path, 'w', encoding='utf-8') as handle:
              handle.write(rendered)
          PY

      - name: Stage validated community catalog
        if: github.ref_name == 'eq-library-community-v0.3' || github.ref_name == 'main'
        run: cp "${RUNNER_TEMP}/validated-community-catalog.json" catalog/catalog.json

      - name: Commit community catalog changes
        if: github.ref_name == 'eq-library-community-v0.3' || github.ref_name == 'main'
        run: |
          set -euo pipefail
          if git diff --quiet -- catalog/catalog.json; then
            echo "No validated curated community EQ changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/catalog.json
          git commit -m "Refresh curated community EQ catalog"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload community publication reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: curated-community-eq-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/community-reports/
            ${{ runner.temp }}/validated-community-catalog.json
          retention-days: 14
