name: Community EQ currentness

on:
  push:
    branches:
      - eq-library-community-v0.3
    paths:
      - '.github/workflows/community-currentness.yml'
      - 'tools/reddit_community_ingest.py'
      - 'tools/community_peq_ingest.py'
      - 'tools/catalog_merge.py'
      - 'config/source_registry.json'
  workflow_dispatch:
  schedule:
    - cron: '43 10 * * *'

permissions:
  contents: write

concurrency:
  group: community-eq-currentness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-community:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Validate current source registry
        run: python3 tools/catalog_pipeline.py validate-registry --registry config/source_registry.json

      - name: Ingest Edition XS public Reddit structured PEQ posts
        run: >-
          python3 tools/reddit_community_ingest.py
          --catalog catalog/catalog.json
          --output "${RUNNER_TEMP}/catalog.community.json"
          --report "${RUNNER_TEMP}/reddit-community-report.json"
          --subreddit headphones
          --subreddit oratory1990
          --headphone-model "Edition XS"
          --limit 100

      - name: Validate candidate atomically
        run: >-
          python3 tools/catalog_pipeline.py publish
          --candidate "${RUNNER_TEMP}/catalog.community.json"
          --published "${RUNNER_TEMP}/validated-community-catalog.json"
          --last-known-good "${RUNNER_TEMP}/validated-community-lkg.json"

      - name: Minify Android transport catalog
        run: |
          python3 - <<'PY'
          import json, os
          path = os.environ['RUNNER_TEMP'] + '/validated-community-catalog.json'
          with open(path, encoding='utf-8') as handle:
              payload = json.load(handle)
          rendered = json.dumps(payload, sort_keys=True, separators=(',', ':'), ensure_ascii=False) + '\n'
          with open(path, 'w', encoding='utf-8') as handle:
              handle.write(rendered)
          PY

      - name: Stage validated community catalog
        if: github.ref_name == 'eq-library-community-v0.3' || github.ref_name == 'main'
        run: cp "${RUNNER_TEMP}/validated-community-catalog.json" catalog/catalog.json

      - name: Commit community catalog changes
        if: github.ref_name == 'eq-library-community-v0.3' || github.ref_name == 'main'
        run: |
          if git diff --quiet -- catalog/catalog.json; then
            echo "No validated Edition XS community EQ changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/catalog.json
          git commit -m "Refresh Edition XS community EQ catalog"
          git push

      - name: Upload Edition XS community discovery report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: edition-xs-community-eq-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/reddit-community-report.json
            ${{ runner.temp }}/validated-community-catalog.json
          retention-days: 14
