name: Finalize EW300 lifecycle boundary

on:
  push:
    branches: [feature/v0.7-ew300-luna-high]
    paths:
      - .github/workflows/ew300-lifecycle-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feature/v0.7-ew300-luna-high
          fetch-depth: 0

      - name: Move EW300 Flash initiation fully behind ViewModel event boundary
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "app/src/main/java/com/weekssa/opraeqforuapp/ui/EqLibraryActions.kt",
              "    val onFlashEw300FromMyDac: suspend (OpraEqProfile) -> String,\n",
              "    val onFlashEw300FromMyDac: (OpraEqProfile) -> Unit,\n",
          )
          replace(
              "app/src/main/java/com/weekssa/opraeqforuapp/MainActivity.kt",
              "        onFlashEw300FromMyDac = { profile -> resolve(viewModel.flashEw300FromMyDac(profile)) },\n",
              "        onFlashEw300FromMyDac = viewModel::flashEw300FromMyDac,\n",
          )
          replace(
              "app/src/main/java/com/weekssa/opraeqforuapp/ui/EqLibraryViewModel.kt",
              "    suspend fun flashEw300FromMyDac(profile: OpraEqProfile): UiText =\n        flashEw300Profile(profile)\n",
              "    fun flashEw300FromMyDac(profile: OpraEqProfile) {\n        viewModelScope.launch { flashEw300Profile(profile) }\n    }\n",
          )
          replace(
              "app/src/main/java/com/weekssa/opraeqforuapp/ui/EqLibraryApp.kt",
              "                        onFlashEw300Profile = { profile ->\n                            scope.launch { showMessage(onFlashEw300FromMyDac(profile)) }\n                        },\n",
              "                        onFlashEw300Profile = onFlashEw300FromMyDac,\n",
          )

          marker = "    var lastBlackPearlOperationSignature by remember { mutableStateOf<String?>(null) }\n"
          app = Path("app/src/main/java/com/weekssa/opraeqforuapp/ui/EqLibraryApp.kt")
          text = app.read_text()
          if marker not in text:
              raise SystemExit("EW300 durable feedback insertion marker missing")
          durable_feedback = '''    var lastEw300FlashOperationId by remember {\n        mutableStateOf(state.ew300OperationTrace?.operationId)\n    }\n    LaunchedEffect(state.ew300OperationTrace?.operationId) {\n        val trace = state.ew300OperationTrace ?: return@LaunchedEffect\n        if (trace.operation != "FLASH" || trace.operationId == lastEw300FlashOperationId) {\n            return@LaunchedEffect\n        }\n        lastEw300FlashOperationId = trace.operationId\n        when {\n            trace.stateKnown && trace.outcome == "Success" && trace.finalReadbackMatched ->\n                showDeviceOperation(\n                    message = "SIMGOT EW300 DSP EQ was saved and verified. Final hardware readback matched.",\n                    duration = SnackbarDuration.Short,\n                )\n            !trace.stateKnown -> showDeviceOperation(\n                message = "EW300 Flash did not finish with a verified state. Do not retry this operation; review the operation report.",\n                duration = SnackbarDuration.Indefinite,\n            )\n            else -> showDeviceOperation(\n                message = "EW300 Flash stopped before verified persistence (${trace.outcome}).",\n                duration = SnackbarDuration.Short,\n            )\n        }\n    }\n\n'''
          app.write_text(text.replace(marker, durable_feedback + marker, 1))

      - name: Remove one-shot workflow and commit final code boundary
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/ew300-lifecycle-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/weekssa/opraeqforuapp/MainActivity.kt \
                  app/src/main/java/com/weekssa/opraeqforuapp/ui/EqLibraryActions.kt \
                  app/src/main/java/com/weekssa/opraeqforuapp/ui/EqLibraryApp.kt \
                  app/src/main/java/com/weekssa/opraeqforuapp/ui/EqLibraryViewModel.kt
          git commit -m "fix: make EW300 Flash a ViewModel event"
          git push origin HEAD:feature/v0.7-ew300-luna-high
