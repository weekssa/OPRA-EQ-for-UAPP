name: Finalize Phase 1 status edits v2

on:
  push:
    paths:
      - .github/workflows/finalize-phase1-status-v2.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Apply idempotent finalization edits
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_if_present(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old in text:
                  p.write_text(text.replace(old, new, 1), encoding="utf-8")
                  return True
              if new in text:
                  return False
              raise SystemExit(f"Neither old nor new expected text found in {path}: {old[:80]!r}")

          replace_if_present(
              "app/src/main/java/com/weekssa/opraeqforuapp/data/managed/ManagedHeadphonesRepository.kt",
              '''    suspend fun removeUnavailableProfile(productId: String, profileId: String) {
                  database.withTransaction {
                      val profile = dao.getProfiles(productId).firstOrNull { it.profileId == profileId }
                          ?: return@withTransaction
                      require(profile.noLongerAvailable) {
                          "Only profiles no longer available in OPRA may be removed directly from retained state."
                      }
                      dao.deleteProfile(productId, profileId)
                      if (dao.countSelectedProfiles(productId) == 0) {
                          dao.deleteHeadphone(productId)
                      }
                  }
              }
          ''',
              '''    suspend fun removeRetainedProfile(productId: String, profileId: String) {
                  database.withTransaction {
                      val profile = dao.getProfiles(productId).firstOrNull { it.profileId == profileId }
                          ?: return@withTransaction
                      require(
                          profile.noLongerAvailable ||
                              (!profile.selected && profile.generatedXml != null)
                      ) {
                          "Only removed-upstream or unselected profiles retaining last-good generated state may be removed directly."
                      }
                      dao.deleteProfile(productId, profileId)
                      if (dao.countProfiles(productId) == 0) {
                          dao.deleteHeadphone(productId)
                      }
                  }
              }
          ''',
          )

          replace_if_present(
              "app/src/main/java/com/weekssa/opraeqforuapp/MainActivity.kt",
              "managedHeadphonesRepository.removeUnavailableProfile(productId, profileId)",
              "managedHeadphonesRepository.removeRetainedProfile(productId, profileId)",
          )

          replace_if_present(
              "app/src/main/java/com/weekssa/opraeqforuapp/ui/screens/ManagedHeadphoneDetailScreen.kt",
              "if (profile.selected || profile.noLongerAvailable) {",
              "if (profile.selected || profile.noLongerAvailable || (!profile.selected && profile.generatedXml != null)) {",
          )
          replace_if_present(
              "app/src/main/java/com/weekssa/opraeqforuapp/ui/screens/ManagedHeadphoneDetailScreen.kt",
              'compatibility == ProfileCompatibility.NotCompatible -> Text("Not compatible · unavailable for selection")',
              'compatibility == ProfileCompatibility.NotCompatible && profile.generatedXml != null -> Text("Not compatible · last generated preset retained")\n                    compatibility == ProfileCompatibility.NotCompatible -> Text("Not compatible · unavailable for selection")',
          )

          runbook = Path("docs/CHATGPT_PROJECT_RUNBOOK.md")
          text = runbook.read_text(encoding="utf-8")
          old_intro = '''At the start of substantive work, read this file and then read the current architecture supplement:

          - `docs/ARCHITECTURE.md`

          If additional current architecture or UX documents are referenced here later, read those as well before implementation.'''
          new_intro = '''At the start of substantive work, read this file and then read the current implementation supplements:

          - `docs/ARCHITECTURE.md`
          - `docs/PHASE1_DECISIONS.md`

          If additional current architecture or UX documents are referenced here later, read those as well before implementation.'''
          if old_intro in text:
              text = text.replace(old_intro, new_intro, 1)

          old_phase = '''The first validated foundation slice now exists and includes:

          - native Android project scaffold;
          - app ID / minSdk / stable API baseline;
          - Kotlin + Jetpack Compose app shell;
          - approved My Headphones / Browse OPRA peer navigation shell;
          - Settings secondary-screen behavior;
          - persistent System / Light / Dark appearance preference;
          - persistent three-way profile-visibility preferences;
          - initial domain compatibility invariant for Not-compatible profiles;
          - `CHANGELOG.md`;
          - `docs/ARCHITECTURE.md`;
          - Android CI running unit tests and building a debug APK.

          At foundation commit `556ba9f769da31ce157654bba10f5a075707f219`, GitHub Actions validation passed `:app:testDebugUnitTest` and `:app:assembleDebug`.

          The first foundation intentionally does **not** fabricate catalog data. Runtime catalog sync/cache, Room-managed headphone state, Kotlin conversion, export, WorkManager change checks, release checks, and production app-icon assets remain subsequent Phase 1 slices.'''
          new_phase = '''Phase 1 now contains the native Android application across the approved autonomous implementation slices: runtime OPRA catalog validation/cache and offline Browse/Search; Room-managed selections/exclusions/review state; native Kotlin ToneBoosters conversion and golden parity fixtures; deterministic refresh reconciliation and WorkManager checks; SAF export with app-file ownership/conflict handling and optional cleanup; GitHub Release update UX; OPRA attribution/privacy/license surfaces; managed-headphone review/removal; and the approved Equalizer Headphones adaptive icon.

          Android CI is the automated gate and runs unit tests, Android lint, and a debug APK build. A successful current-main run also publishes the debug APK as a workflow artifact for hands-on validation.

          The next product gate is hands-on Pixel 9/UAPP validation. Automated CI does not substitute for TalkBack/large-text/theme checks, actual SAF-provider behavior, launcher/themed-icon appearance, or importing representative generated XML into USB Audio Player PRO/ToneBoosters. Public distribution/signing remains intentionally deferred until that validation is complete.'''
          if old_phase in text:
              text = text.replace(old_phase, new_phase, 1)

          old_current = '''The validated Phase 1 foundation exists. Current implemented foundation includes the Android project, app shell, local appearance/profile-visibility preferences, initial compatibility invariant, changelog, architecture document, and Android CI.

          The next planned focused slice is the runtime OPRA `database_v1.jsonl` client with validation, last-known-good local cache, and local Browse/Search catalog model. Do not fabricate bundled headphone data while building it.

          Subsequent slices include Room-managed headphone/selection state, Kotlin converter parity, refresh/change reporting + WorkManager, SAF export, public release checks/changelog presentation, and final production icon/accessibility/release hardening.'''
          new_current = '''The Phase 1 Android application is implemented through the approved autonomous slices: zero-bundled-data runtime OPRA sync/cache; offline Browse/Search; Room-managed headphone/selection/exclusion/review state; Kotlin conversion parity; local generated-preset retention; change reconciliation + WorkManager; SAF export/ownership/cleanup; GitHub Release update UX; OPRA attribution/privacy/licenses; managed-headphone review/removal; and production adaptive/monochrome icon assets.

          Current automated validation is defined in `.github/workflows/android-ci.yml` and must pass unit tests, Android lint, and debug APK assembly before a handoff. The workflow publishes the debug APK artifact after a successful current-main validation.

          **Next required gate:** hands-on Pixel 9 validation, including actual UAPP/ToneBoosters preset import and accessibility/theme/storage checks. After device validation, public GitHub Release accessibility and one stable release-signing identity must be resolved before public distribution. Do not commit signing keys or credentials.'''
          if old_current in text:
              text = text.replace(old_current, new_current, 1)
          runbook.write_text(text, encoding="utf-8")

          ci = Path(".github/workflows/android-ci.yml")
          ci_text = ci.read_text(encoding="utf-8")
          if "Upload debug APK" not in ci_text:
              needle = "      - name: Run unit tests, Android lint, and build debug APK\n        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace\n"
              if needle not in ci_text:
                  raise SystemExit("Expected Android CI build step not found")
              ci_text = ci_text.replace(
                  needle,
                  needle + '''
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: opra-eq-for-uapp-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
''',
                  1,
              )
              ci.write_text(ci_text, encoding="utf-8")
          PY

      - name: Commit finalization and remove maintenance workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/finalize-phase1-status.yml
          rm -f .github/workflows/cleanup-phase1-finalizer.yml
          rm -f .github/workflows/finalize-phase1-status-v2.yml
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Finalize Phase 1 implementation status"
          git push
