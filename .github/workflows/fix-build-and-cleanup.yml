name: Fix build and clean temporary workflows

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Apply build fix and clean maintenance workflows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          repo = Path('app/src/main/java/com/weekssa/opraeqforuapp/data/managed/ManagedHeadphonesRepository.kt')
          text = repo.read_text()
          old = 'dao.countSelectedProfiles(productId)'
          new = 'dao.countProfiles(productId)'
          if old in text:
              repo.write_text(text.replace(old, new))
          elif new not in text:
              raise SystemExit('Expected retained-profile cleanup call not found')

          ci = Path('.github/workflows/android-ci.yml')
          text = ci.read_text()
          text = text.replace(
              '- name: Run unit tests and build debug APK\n        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace',
              '- name: Run unit tests, Android lint, and build debug APK\n        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace\n\n      - name: Upload debug APK\n        if: github.event_name == \'push\'\n        uses: actions/upload-artifact@v4\n        with:\n          name: opra-eq-for-uapp-debug\n          path: app/build/outputs/apk/debug/app-debug.apk\n          if-no-files-found: error'
          )
          if 'actions/upload-artifact@v4' not in text:
              raise SystemExit('Failed to add debug APK artifact upload to Android CI')
          ci.write_text(text)
          PY

          rm -f \
            .github/workflows/cleanup-phase1-finalizer.yml \
            .github/workflows/finalize-phase1-status-v2.yml \
            .github/workflows/finalize-phase1-status.yml \
            .github/workflows/record-final-validation.yml \
            .github/workflows/fix-build-and-cleanup.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/weekssa/opraeqforuapp/data/managed/ManagedHeadphonesRepository.kt .github/workflows
          if git diff --cached --quiet; then
            echo 'No maintenance changes required.'
            exit 0
          fi
          git commit -m 'Fix final validation build and clean workflows'
          git push origin HEAD:main
