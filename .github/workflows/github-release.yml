name: Signed GitHub Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build a signed candidate for device testing, or publish after that candidate passes.
        required: true
        default: candidate
        type: choice
        options:
          - candidate
          - publish
      tag:
        description: Release tag in exact vMAJOR.MINOR.PATCH form.
        required: true
        default: v0.1.0
        type: string
      confirm_publish:
        description: For publish mode only, type PUBLISH. Leave blank for candidate mode.
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: signed-github-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-signed-apk:
    if: github.repository == 'weekssa/OPRA-EQ-for-UAPP' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: "9.4.1"
          cache-provider: basic

      - name: Validate release inputs and repository files
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release tags must use exact SemVer form vMAJOR.MINOR.PATCH" >&2
            exit 1
          }
          tag_version="${RELEASE_TAG#v}"
          version_name="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$version_name"
          test "$tag_version" = "$version_name" || {
            echo "Requested tag $RELEASE_TAG does not match app versionName $version_name" >&2
            exit 1
          }
          test -f "docs/releases/${RELEASE_TAG}.md" || {
            echo "Missing curated release notes: docs/releases/${RELEASE_TAG}.md" >&2
            exit 1
          }
          test -f "release-signing-cert.sha256" || {
            echo "Missing public release-signing certificate fingerprint file" >&2
            exit 1
          }

      - name: Validate signing secrets
        env:
          OPRA_RELEASE_KEYSTORE_BASE64: ${{ secrets.OPRA_RELEASE_KEYSTORE_BASE64 }}
          OPRA_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.OPRA_RELEASE_KEYSTORE_PASSWORD }}
          OPRA_RELEASE_KEY_ALIAS: ${{ secrets.OPRA_RELEASE_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          : "${OPRA_RELEASE_KEYSTORE_BASE64:?Missing OPRA_RELEASE_KEYSTORE_BASE64 repository secret}"
          : "${OPRA_RELEASE_KEYSTORE_PASSWORD:?Missing OPRA_RELEASE_KEYSTORE_PASSWORD repository secret}"
          : "${OPRA_RELEASE_KEY_ALIAS:?Missing OPRA_RELEASE_KEY_ALIAS repository secret}"

      - name: Restore release keystore
        env:
          OPRA_RELEASE_KEYSTORE_BASE64: ${{ secrets.OPRA_RELEASE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$OPRA_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/opra-eq-release.p12"
          chmod 600 "$RUNNER_TEMP/opra-eq-release.p12"

      - name: Run release gate and build unsigned APK
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --stacktrace

      - name: Align, sign, and verify APK
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          OPRA_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.OPRA_RELEASE_KEYSTORE_PASSWORD }}
          OPRA_RELEASE_KEY_ALIAS: ${{ secrets.OPRA_RELEASE_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          unsigned_apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          aligned_apk="$RUNNER_TEMP/opra-eq-release-aligned.apk"
          output_directory="dist"
          output_apk="$output_directory/OPRA-EQ-for-UAPP-${RELEASE_TAG}.apk"
          build_tools="$ANDROID_HOME/build-tools/36.0.0"

          test -f "$unsigned_apk"
          mkdir -p "$output_directory"
          "$build_tools/zipalign" -p -f 4 "$unsigned_apk" "$aligned_apk"
          "$build_tools/apksigner" sign \
            --ks "$RUNNER_TEMP/opra-eq-release.p12" \
            --ks-key-alias "$OPRA_RELEASE_KEY_ALIAS" \
            --ks-pass env:OPRA_RELEASE_KEYSTORE_PASSWORD \
            --key-pass env:OPRA_RELEASE_KEYSTORE_PASSWORD \
            --out "$output_apk" \
            "$aligned_apk"

          "$build_tools/apksigner" verify --verbose --print-certs "$output_apk" | tee "$output_directory/apksigner-verification.txt"

          actual_fingerprint="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$output_directory/apksigner-verification.txt" | head -n 1 | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          expected_fingerprint="$(tr -d '[:space:]:' < release-signing-cert.sha256 | tr '[:upper:]' '[:lower:]')"
          test -n "$actual_fingerprint"
          test "$actual_fingerprint" = "$expected_fingerprint" || {
            echo "Release signing certificate does not match the repository-pinned fingerprint" >&2
            exit 1
          }

          sha256sum "$output_apk" > "${output_apk}.sha256"

      - name: Upload signed candidate artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OPRA-EQ-for-UAPP-${{ inputs.tag }}-signed-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-release:
    if: inputs.mode == 'publish'
    needs: build-signed-apk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download verified signed artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: OPRA-EQ-for-UAPP-${{ inputs.tag }}-signed-${{ github.sha }}
          path: dist

      - name: Confirm publication and ensure tag is new
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          CONFIRM_PUBLISH: ${{ inputs.confirm_publish }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRM_PUBLISH" = "PUBLISH" || {
            echo "Publish mode requires confirm_publish to equal PUBLISH" >&2
            exit 1
          }
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists; refusing to replace an existing release identity" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to replace it" >&2
            exit 1
          fi

      - name: Publish GitHub Release and create immutable version tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          output_apk="dist/OPRA-EQ-for-UAPP-${RELEASE_TAG}.apk"
          test -f "$output_apk"
          test -f "${output_apk}.sha256"
          gh release create "$RELEASE_TAG" \
            "$output_apk" \
            "${output_apk}.sha256" \
            "dist/apksigner-verification.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "OPRA EQ for UAPP ${RELEASE_TAG}" \
            --notes-file "docs/releases/${RELEASE_TAG}.md"
