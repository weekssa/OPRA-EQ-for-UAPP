name: Publish GitHub Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: github-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'weekssa/OPRA-EQ-for-UAPP'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      OPRA_RELEASE_KEYSTORE_BASE64: ${{ secrets.OPRA_RELEASE_KEYSTORE_BASE64 }}
      OPRA_RELEASE_STORE_PASSWORD: ${{ secrets.OPRA_RELEASE_STORE_PASSWORD }}
      OPRA_RELEASE_KEY_ALIAS: ${{ secrets.OPRA_RELEASE_KEY_ALIAS }}
      OPRA_RELEASE_KEY_PASSWORD: ${{ secrets.OPRA_RELEASE_KEY_PASSWORD }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: "9.4.1"
          cache-provider: basic

      - name: Validate release tag and files
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          version_name="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$version_name"
          test "$tag_version" = "$version_name" || {
            echo "Tag $GITHUB_REF_NAME does not match app versionName $version_name" >&2
            exit 1
          }
          test -f "docs/releases/${GITHUB_REF_NAME}.md" || {
            echo "Missing curated release notes: docs/releases/${GITHUB_REF_NAME}.md" >&2
            exit 1
          }
          test -f "release-signing-cert.sha256" || {
            echo "Missing public release-signing certificate fingerprint file" >&2
            exit 1
          }

      - name: Validate signing secrets
        shell: bash
        run: |
          set -euo pipefail
          : "${OPRA_RELEASE_KEYSTORE_BASE64:?Missing OPRA_RELEASE_KEYSTORE_BASE64 repository secret}"
          : "${OPRA_RELEASE_STORE_PASSWORD:?Missing OPRA_RELEASE_STORE_PASSWORD repository secret}"
          : "${OPRA_RELEASE_KEY_ALIAS:?Missing OPRA_RELEASE_KEY_ALIAS repository secret}"
          : "${OPRA_RELEASE_KEY_PASSWORD:?Missing OPRA_RELEASE_KEY_PASSWORD repository secret}"

      - name: Restore release keystore
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$OPRA_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/opra-eq-release.keystore"
          chmod 600 "$RUNNER_TEMP/opra-eq-release.keystore"

      - name: Run release gate and build unsigned APK
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --stacktrace

      - name: Align, sign, and verify APK
        shell: bash
        run: |
          set -euo pipefail
          unsigned_apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          aligned_apk="$RUNNER_TEMP/opra-eq-release-aligned.apk"
          output_apk="OPRA-EQ-for-UAPP-${GITHUB_REF_NAME}.apk"
          build_tools="$ANDROID_HOME/build-tools/36.0.0"

          test -f "$unsigned_apk"
          "$build_tools/zipalign" -p -f 4 "$unsigned_apk" "$aligned_apk"
          "$build_tools/apksigner" sign \
            --ks "$RUNNER_TEMP/opra-eq-release.keystore" \
            --ks-key-alias "$OPRA_RELEASE_KEY_ALIAS" \
            --ks-pass env:OPRA_RELEASE_STORE_PASSWORD \
            --key-pass env:OPRA_RELEASE_KEY_PASSWORD \
            --out "$output_apk" \
            "$aligned_apk"

          "$build_tools/apksigner" verify --verbose --print-certs "$output_apk" | tee "$RUNNER_TEMP/apksigner-verification.txt"

          actual_fingerprint="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apksigner-verification.txt" | head -n 1 | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          expected_fingerprint="$(tr -d '[:space:]:' < release-signing-cert.sha256 | tr '[:upper:]' '[:lower:]')"
          test -n "$actual_fingerprint"
          test "$actual_fingerprint" = "$expected_fingerprint" || {
            echo "Release signing certificate does not match the repository-pinned fingerprint" >&2
            exit 1
          }

          sha256sum "$output_apk" > "${output_apk}.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          output_apk="OPRA-EQ-for-UAPP-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" \
            "$output_apk" \
            "${output_apk}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "OPRA EQ for UAPP ${GITHUB_REF_NAME}" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
