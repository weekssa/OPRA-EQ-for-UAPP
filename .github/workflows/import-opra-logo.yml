name: Import OPRA attribution logo

on:
  push:
    paths:
      - .github/workflows/import-opra-logo.yml

permissions:
  contents: write

jobs:
  import-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download official OPRA logo
        run: |
          mkdir -p app/src/main/res/drawable
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/opra-project/OPRA/main/images/opra_logo.png \
            --output app/src/main/res/drawable/opra_logo.png
          test -s app/src/main/res/drawable/opra_logo.png

      - name: Commit attribution asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/drawable/opra_logo.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add official OPRA attribution logo"
          git push
