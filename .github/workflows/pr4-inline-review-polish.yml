name: Apply PR4 inline review polish

on:
  push:
    branches:
      - v0.3-release-polish
    paths:
      - .github/workflows/pr4-inline-review-polish.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.3-release-polish
          fetch-depth: 0
      - name: Apply approved review-state and density polish
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}: {old[:120]!r}")
              text = text.replace(old, new, 1)
              p.write_text(text)

          dao = "app/src/main/java/com/weekssa/opraeqforuapp/data/managed/ManagedHeadphonesDao.kt"
          replace_once(
              dao,
              "import androidx.room.Query\nimport androidx.room.Transaction\nimport androidx.room.Upsert",
              "import androidx.room.Query\nimport androidx.room.Upsert",
          )
          replace_once(
              dao,
              "    @Query(\"SELECT * FROM managed_profiles WHERE productId = :productId ORDER BY profileId\")\n    fun observeProfiles(productId: String): Flow<List<ManagedProfileEntity>>\n",
              "    @Query(\"SELECT * FROM managed_profiles WHERE productId = :productId ORDER BY profileId\")\n    fun observeProfiles(productId: String): Flow<List<ManagedProfileEntity>>\n\n    @Query(\"SELECT * FROM managed_profiles ORDER BY productId, profileId\")\n    fun observeAllProfiles(): Flow<List<ManagedProfileEntity>>\n",
          )
          replace_once(
              dao,
              "    @Query(\"UPDATE managed_profiles SET isNewUnreviewed = 0, isUpdatedUnreviewed = 0 WHERE productId = :productId\")\n    suspend fun clearReviewFlags(productId: String)\n\n    @Query(\"UPDATE managed_headphones SET updatedAtMillis = :updatedAtMillis WHERE productId = :productId\")\n    suspend fun touchHeadphone(productId: String, updatedAtMillis: Long)\n\n    @Transaction\n    suspend fun markReviewed(productId: String) {\n        clearReviewFlags(productId)\n        touchHeadphone(productId, System.currentTimeMillis())\n    }",
              "    @Query(\"UPDATE managed_profiles SET isNewUnreviewed = 0, isUpdatedUnreviewed = 0 WHERE productId = :productId\")\n    suspend fun markReviewed(productId: String)",
          )

          repo = "app/src/main/java/com/weekssa/opraeqforuapp/data/managed/ManagedHeadphonesRepository.kt"
          replace_once(
              repo,
              "        combine(\n            dao.observeHeadphones(),\n            dao.observeOutputHeadphones(outputId),\n            dao.observeOutputProfiles(outputId),\n        ) { headphones, outputHeadphones, outputProfiles ->\n            val outputByProduct = outputHeadphones.associateBy(OutputManagedHeadphoneEntity::productId)\n            val outputProfilesByProduct = outputProfiles.groupBy(OutputManagedProfileEntity::productId)\n            headphones.mapNotNull { headphone ->\n                val output = outputByProduct[headphone.productId] ?: return@mapNotNull null\n                val selectionById = outputProfilesByProduct[headphone.productId]\n                    .orEmpty()\n                    .associateBy(OutputManagedProfileEntity::profileId)\n                headphone.toDomain(\n                    profiles = dao.getProfiles(headphone.productId),",
              "        combine(\n            dao.observeHeadphones(),\n            dao.observeAllProfiles(),\n            dao.observeOutputHeadphones(outputId),\n            dao.observeOutputProfiles(outputId),\n        ) { headphones, profiles, outputHeadphones, outputProfiles ->\n            val outputByProduct = outputHeadphones.associateBy(OutputManagedHeadphoneEntity::productId)\n            val profilesByProduct = profiles.groupBy(ManagedProfileEntity::productId)\n            val outputProfilesByProduct = outputProfiles.groupBy(OutputManagedProfileEntity::productId)\n            headphones.mapNotNull { headphone ->\n                val output = outputByProduct[headphone.productId] ?: return@mapNotNull null\n                val selectionById = outputProfilesByProduct[headphone.productId]\n                    .orEmpty()\n                    .associateBy(OutputManagedProfileEntity::profileId)\n                headphone.toDomain(\n                    profiles = profilesByProduct[headphone.productId].orEmpty(),",
          )

          ui = "app/src/main/java/com/weekssa/opraeqforuapp/ui/screens/ManagedHeadphoneDetailScreen.kt"
          replace_once(
              ui,
              "import androidx.activity.compose.BackHandler\nimport androidx.compose.foundation.layout.Arrangement",
              "import androidx.activity.compose.BackHandler\nimport androidx.compose.foundation.clickable\nimport androidx.compose.foundation.layout.Arrangement",
          )
          replace_once(
              ui,
              "    val pendingUpdatedCount = headphone.profiles.count {\n        it.isUpdatedUnreviewed && !it.noLongerAvailable && !it.isNewUnreviewed\n    }\n",
              "    val pendingUpdatedCount = headphone.profiles.count {\n        it.isUpdatedUnreviewed && !it.noLongerAvailable && !it.isNewUnreviewed\n    }\n    val hasPendingReview = headphone.autoIncludeNewProfiles &&\n        (pendingNewCount > 0 || pendingUpdatedCount > 0)\n    val pendingReviewLabel = buildList {\n        if (pendingNewCount > 0) add(\"$pendingNewCount new\")\n        if (pendingUpdatedCount > 0) add(\"$pendingUpdatedCount updated\")\n    }.joinToString(\" · \")\n",
          )
          replace_once(
              ui,
              '''        Text(\n            text = buildString {\n                append(headphone.selectedProfileCount)\n                append(" selected")\n                availableProfileCount?.let {\n                    append(" · ")\n                    append(it)\n                    append(" available")\n                }\n            },\n            modifier = Modifier.padding(horizontal = 16.dp, vertical = 8.dp),\n        )\n''',
              '''        Row(\n            modifier = Modifier\n                .fillMaxWidth()\n                .padding(horizontal = 16.dp),\n            verticalAlignment = Alignment.CenterVertically,\n        ) {\n            Text(\n                text = buildString {\n                    append(headphone.selectedProfileCount)\n                    append(" selected")\n                    availableProfileCount?.let {\n                        append(" · ")\n                        append(it)\n                        append(" available")\n                    }\n                },\n                modifier = Modifier.padding(vertical = 8.dp),\n            )\n            if (hasPendingReview) {\n                Text(" · ", color = MaterialTheme.colorScheme.onSurfaceVariant)\n                Text(\n                    text = "$pendingReviewLabel ›",\n                    color = MaterialTheme.colorScheme.primary,\n                    modifier = Modifier\n                        .clickable(role = Role.Button) { reviewingNewEqs = true }\n                        .padding(horizontal = 4.dp, vertical = 12.dp),\n                )\n            }\n        }\n''',
          )
          replace_once(
              ui,
              '''        if (headphone.autoIncludeNewProfiles && (pendingNewCount > 0 || pendingUpdatedCount > 0)) {\n            Button(\n                onClick = { reviewingNewEqs = true },\n                modifier = Modifier.padding(horizontal = 16.dp, vertical = 4.dp),\n            ) {\n                Text(\n                    buildList {\n                        if (pendingNewCount > 0) add("$pendingNewCount new")\n                        if (pendingUpdatedCount > 0) add("$pendingUpdatedCount updated")\n                    }.joinToString(" · ") + " — Review",\n                )\n            }\n        }\n''',
              "",
          )

          plan = "docs/V0.3_RELEASE_POLISH_PLAN.md"
          replace_once(
              plan,
              "- the final managed-headphone detail action polish: when Black Pearl is active, **Connect/Connected** and **Manage presets** share one compact side-by-side action row instead of two large stacked buttons, while preserving connection state/error handling and Material-accessible touch targets.",
              "- the final managed-headphone detail density polish: when Black Pearl is active, **Connect/Connected** and **Manage presets** share one compact side-by-side action row; pending new/updated review attention appears inline with the selected/available counts as a tappable accent status and disappears immediately after Add selected / Dismiss / Done, while preserving connection state/error handling and Material-accessible touch targets.",
          )
          replace_once(
              plan,
              "12. hidden canonical lineages are excluded from new/updated review queues without changing selected state or stored source data;",
              "12. hidden canonical lineages are excluded from new/updated review queues without changing selected state or stored source data; reviewed flags invalidate the live managed-headphone projection immediately so a completed review cannot leave a stale badge/status;",
          )
          replace_once(
              plan,
              "5. **New-EQ notification control:** on a newly managed headphone confirm **Notify me about new EQs** is present and ON by default; toggling it OFF/ON does not select/deselect any EQ. If the candidate has an available pending new-EQ batch, confirm review rows start unselected, Add selected adds only checked rows, Dismiss reviews without adding, Back leaves pending, and a hidden lineage does not produce a review badge/prompt.",
              "5. **New-EQ notification control:** on a newly managed headphone confirm **Notify me about new EQs** is present and ON by default; toggling it OFF/ON does not select/deselect any EQ. If the candidate has an available pending new-EQ batch, confirm its `new` / `updated` count is an inline tappable accent beside the selected/available counts, review rows start unselected, Add selected adds only checked rows, Dismiss/Done clears the inline attention immediately without adding, Back leaves pending, and a hidden lineage does not produce a review badge/prompt.",
          )
          replace_once(
              plan,
              "The compact managed-headphone action row is presentation-only: it shortens **Connect to DAC** to **Connect** on the detail page, shortens **Manage preset selection** to **Manage presets**, preserves connection/disabled/error behavior, and keeps at least a 48 dp minimum action height. It does not change Black Pearl protocol/DSP behavior or preset-selection semantics.",
              "The managed-headphone density polish is presentation-only around actions/status: it shortens **Connect to DAC** to **Connect** on the detail page, shortens **Manage preset selection** to **Manage presets**, preserves connection/disabled/error behavior, keeps at least a 48 dp minimum action height, and moves pending review attention into the selected/available summary line. The review-state fix observes managed profile flags directly so completing a review updates that inline status immediately. It does not change Black Pearl protocol/DSP behavior or preset-selection semantics.",
          )

          checklist = "docs/V0.3_HANDS_ON_CHECKLIST.md"
          replace_once(
              checklist,
              "7. **New-EQ notification/review:** Add a never-managed headphone after explicitly choosing its EQs and confirm My EQs shows **Notify me about new EQs** ON by default. Toggle the switch OFF and ON and confirm the selected EQ set, export state, favorites, and Flash state do not change. If this exact candidate already contains a pending new-EQ review for a saved headphone, confirm new rows start with none selected; **Add selected** adds only checked rows; **Dismiss** marks the batch reviewed without adding/hiding/deleting unchosen rows; Back leaves the batch pending. If a pending row belongs to a lineage you hide, confirm that hidden lineage no longer produces a review badge/prompt while hidden. New-arrival cases that cannot be induced safely on-device are covered by the exact-head reconciliation/unit tests and are not a reason to manufacture catalog data on the phone.",
              "7. **New-EQ notification/review:** Add a never-managed headphone after explicitly choosing its EQs and confirm My EQs shows **Notify me about new EQs** ON by default. Toggle the switch OFF and ON and confirm the selected EQ set, export state, favorites, and Flash state do not change. If this exact candidate already contains a pending new-EQ review for a saved headphone, confirm the pending `new` / `updated` status is inline beside the selected/available counts and opens Review; new rows start with none selected; **Add selected** adds only checked rows; **Dismiss/Done** marks the batch reviewed without adding/hiding/deleting unchosen rows and the inline status clears immediately; Back leaves the batch pending. If a pending row belongs to a lineage you hide, confirm that hidden lineage no longer produces review attention while hidden. New-arrival cases that cannot be induced safely on-device are covered by the exact-head reconciliation/unit tests and are not a reason to manufacture catalog data on the phone.",
          )

          changelog = "CHANGELOG.md"
          replace_once(
              changelog,
              "- Managed-headphone detail now uses one compact side-by-side **Connect/Connected** + **Manage presets** action row when Black Pearl is active, preserving accessible touch targets and existing connection/error behavior while reclaiming vertical space.",
              "- Managed-headphone detail now uses one compact side-by-side **Connect/Connected** + **Manage presets** action row when Black Pearl is active, and pending `new` / `updated` review attention is shown as an inline tappable status beside the selected/available counts instead of a separate full-width review button.",
          )
          replace_once(
              changelog,
              "### Fixed\n\n- Newly discovered EQs no longer become selected automatically under any notification setting.",
              "### Fixed\n\n- Completing a new/updated-EQ review now clears its attention status immediately on the managed-headphone detail screen; managed profile review flags are observed reactively instead of waiting for an unrelated UI refresh.\n- Newly discovered EQs no longer become selected automatically under any notification setting.",
          )

          helper = Path(".github/workflows/pr4-inline-review-polish.yml")
          helper.unlink()

      - name: Commit approved polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish inline new-EQ review status"
          git push origin HEAD:v0.3-release-polish
