name: Restore readable catalog formatting once

on:
  push:
    branches:
      - v0.3-release-polish
    paths:
      - '.github/workflows/pretty-catalog-once.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release-polish branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v0.3-release-polish
          fetch-depth: 1

      - name: Restore catalog pretty formatting
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('catalog/catalog.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          path.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          rm .github/workflows/pretty-catalog-once.yml

      - name: Commit formatting-only cleanup
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore readable catalog formatting"
          git pull --rebase origin v0.3-release-polish
          git push origin HEAD:v0.3-release-polish
