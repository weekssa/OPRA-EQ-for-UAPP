name: Promote Signed Release Candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact release tag of the signed candidate (vMAJOR.MINOR.PATCH).
        required: true
        type: string
      candidate_run_id:
        description: Successful Signed Release Candidate workflow run ID.
        required: true
        type: string
      candidate_artifact_id:
        description: Immutable signed-candidate Actions artifact ID from that run.
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: exact-public-release-promotion
  cancel-in-progress: false

jobs:
  verify-candidate:
    if: github.repository == 'weekssa/OPRA-EQ-for-UAPP' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      release_tag: ${{ steps.verify.outputs.release_tag }}
      candidate_run_id: ${{ steps.verify.outputs.candidate_run_id }}
      candidate_artifact_id: ${{ steps.verify.outputs.candidate_artifact_id }}
      source_sha: ${{ steps.verify.outputs.source_sha }}
      artifact_digest: ${{ steps.verify.outputs.artifact_digest }}
      candidate_version_name: ${{ steps.verify.outputs.candidate_version_name }}
      candidate_version_code: ${{ steps.verify.outputs.candidate_version_code }}
      baseline_version_code: ${{ steps.verify.outputs.baseline_version_code }}
      beta_baseline_tag: ${{ steps.verify.outputs.beta_baseline_tag }}
      beta_baseline_version_code: ${{ steps.verify.outputs.beta_baseline_version_code }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the exact publisher source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platform-tools

      - name: Install pinned Android build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "emulator" "system-images;android-35;google_apis;x86_64"

      - name: Verify signed candidate and artifact identity
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          RELEASE_TAG: ${{ inputs.tag }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/promotion-transfer"
          python3 tools/promote_release_candidate.py verify \
            --tag "$RELEASE_TAG" \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --candidate-artifact-id "$CANDIDATE_ARTIFACT_ID" \
            --source-sha "$EXPECTED_SOURCE_SHA" \
            --build-tools "$ANDROID_HOME/build-tools/36.0.0" \
            --project-root . \
            --archive-out "$RUNNER_TEMP/promotion-transfer/candidate.zip" \
            --apk-out "$RUNNER_TEMP/promotion-transfer/candidate.apk" \
            --baseline-apk-out "$RUNNER_TEMP/promotion-transfer/baseline.apk" \
            --beta-apk-out "$RUNNER_TEMP/promotion-transfer/beta-baseline.apk" \
            --github-output "$GITHUB_OUTPUT"

      - name: Verify signed stable install and upgrade paths on API 35
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          CANDIDATE_SOURCE_SHA: ${{ github.sha }}
          BASELINE_TAG: ${{ steps.verify.outputs.baseline_tag }}
          BASELINE_VERSION_NAME: ${{ steps.verify.outputs.baseline_tag }}
          BASELINE_VERSION_CODE: ${{ steps.verify.outputs.baseline_version_code }}
          BETA_BASELINE_TAG: ${{ steps.verify.outputs.beta_baseline_tag }}
          BETA_BASELINE_VERSION_NAME: "0.8.0-beta"
          BETA_BASELINE_VERSION_CODE: ${{ steps.verify.outputs.beta_baseline_version_code }}
          CANDIDATE_VERSION_NAME: ${{ steps.verify.outputs.candidate_version_name }}
          CANDIDATE_VERSION_CODE: ${{ steps.verify.outputs.candidate_version_code }}
        shell: bash
        run: |
          set -euo pipefail
          avd_home="$RUNNER_TEMP/promotion-avd"
          mkdir -p "$avd_home"
          export ANDROID_AVD_HOME="$avd_home"
          printf 'ANDROID_AVD_HOME=%s\n' "$avd_home" >> "$GITHUB_ENV"
          avdmanager create avd --force --name opra_release_promotion --package "system-images;android-35;google_apis;x86_64" --device pixel_6
          sudo chown "$(id -un)" /dev/kvm
          "$ANDROID_SDK_ROOT/emulator/emulator" -accel-check
          nohup "$ANDROID_SDK_ROOT/emulator/emulator" \
            -avd opra_release_promotion -no-window -noaudio -no-boot-anim -no-snapshot -wipe-data \
            -gpu swiftshader_indirect > "$RUNNER_TEMP/promotion-emulator.log" 2>&1 &
          emulator_pid=$!
          for attempt in $(seq 1 90); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/promotion-emulator.log"
              exit 1
            fi
            if adb get-state 2>/dev/null | grep -qx device; then break; fi
            if [[ "$attempt" -eq 90 ]]; then
              cat "$RUNNER_TEMP/promotion-emulator.log"
              exit 1
            fi
            sleep 2
          done
          adb wait-for-device
          for attempt in $(seq 1 60); do
            if [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == "1" ]]; then break; fi
            if [[ "$attempt" -eq 60 ]]; then
              cat "$RUNNER_TEMP/promotion-emulator.log"
              exit 1
            fi
            sleep 5
          done
          mkdir -p "$RUNNER_TEMP/stable-release-evidence"
          if [[ "$RELEASE_TAG" == "v0.8.0" && "$BASELINE_TAG" != "v0.7.2" ]]; then
            echo "v0.8.0 stable qualification requires the exact v0.7.2 upgrade baseline" >&2
            exit 1
          fi
          {
            printf 'release_tag=%s\n' "$RELEASE_TAG"
            printf 'candidate_source_sha=%s\n' "$CANDIDATE_SOURCE_SHA"
            printf 'stable_baseline_tag=%s\n' "$BASELINE_TAG"
            printf 'stable_baseline_version_code=%s\n' "$BASELINE_VERSION_CODE"
            printf 'candidate_version_name=%s\n' "$CANDIDATE_VERSION_NAME"
            printf 'candidate_version_code=%s\n' "$CANDIDATE_VERSION_CODE"
          } > "$RUNNER_TEMP/stable-release-evidence/release-identity.txt"
          sha256sum \
            "$RUNNER_TEMP/promotion-transfer/baseline.apk" \
            "$RUNNER_TEMP/promotion-transfer/candidate.apk" \
            > "$RUNNER_TEMP/stable-release-evidence/apk-sha256sums.txt"
          python3 tools/verify_stable_release_smoke.py upgrade \
            --baseline-apk "$RUNNER_TEMP/promotion-transfer/baseline.apk" \
            --baseline-version-name "${BASELINE_VERSION_NAME#v}" \
            --baseline-version-code "$BASELINE_VERSION_CODE" \
            --candidate-apk "$RUNNER_TEMP/promotion-transfer/candidate.apk" \
            --candidate-version-name "$CANDIDATE_VERSION_NAME" \
            --candidate-version-code "$CANDIDATE_VERSION_CODE" \
            --evidence-dir "$RUNNER_TEMP/stable-release-evidence/${BASELINE_TAG}-to-${RELEASE_TAG}"
          adb uninstall com.weekssa.opraeqforuapp
          if [[ "$RELEASE_TAG" == "v0.8.0" ]]; then
            if [[ "$BETA_BASELINE_TAG" != "v0.8.0-beta" ]]; then
              echo "v0.8.0 stable qualification requires the exact v0.8.0-beta upgrade baseline" >&2
              exit 1
            fi
            {
              printf 'beta_baseline_tag=%s\n' "$BETA_BASELINE_TAG"
              printf 'beta_baseline_version_code=%s\n' "$BETA_BASELINE_VERSION_CODE"
            } >> "$RUNNER_TEMP/stable-release-evidence/release-identity.txt"
            sha256sum "$RUNNER_TEMP/promotion-transfer/beta-baseline.apk" \
              >> "$RUNNER_TEMP/stable-release-evidence/apk-sha256sums.txt"
            python3 tools/verify_stable_release_smoke.py upgrade \
              --baseline-apk "$RUNNER_TEMP/promotion-transfer/beta-baseline.apk" \
              --baseline-version-name "$BETA_BASELINE_VERSION_NAME" \
              --baseline-version-code "$BETA_BASELINE_VERSION_CODE" \
              --candidate-apk "$RUNNER_TEMP/promotion-transfer/candidate.apk" \
              --candidate-version-name "$CANDIDATE_VERSION_NAME" \
              --candidate-version-code "$CANDIDATE_VERSION_CODE" \
              --evidence-dir "$RUNNER_TEMP/stable-release-evidence/beta-to-stable"
            adb uninstall com.weekssa.opraeqforuapp
          fi
          python3 tools/verify_stable_release_smoke.py clean-install \
            --candidate-apk "$RUNNER_TEMP/promotion-transfer/candidate.apk" \
            --candidate-version-name "$CANDIDATE_VERSION_NAME" \
            --candidate-version-code "$CANDIDATE_VERSION_CODE" \
            --evidence-dir "$RUNNER_TEMP/stable-release-evidence/stable-clean-install"
          adb logcat -d > "$RUNNER_TEMP/promotion-logcat.txt"

      - name: Upload promotion emulator diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-promotion-emulator-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/promotion-emulator.log
            ${{ runner.temp }}/promotion-logcat.txt
            ${{ runner.temp }}/stable-release-evidence/
          if-no-files-found: ignore
          retention-days: 14

      - name: Transfer the verified candidate archive to the publisher job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-candidate-archive-${{ github.run_id }}
          path: ${{ runner.temp }}/promotion-transfer/candidate.zip
          if-no-files-found: error
          retention-days: 1

  create-candidate-tag:
    needs: verify-candidate
    if: github.repository == 'weekssa/OPRA-EQ-for-UAPP' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out the exact publisher source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Bind the validated candidate to an immutable annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          RELEASE_TAG: ${{ needs.verify-candidate.outputs.release_tag }}
          CANDIDATE_RUN_ID: ${{ needs.verify-candidate.outputs.candidate_run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ needs.verify-candidate.outputs.candidate_artifact_id }}
          EXPECTED_SOURCE_SHA: ${{ needs.verify-candidate.outputs.source_sha }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.verify-candidate.outputs.artifact_digest }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/promote_release_candidate.py tag \
            --tag "$RELEASE_TAG" \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --candidate-artifact-id "$CANDIDATE_ARTIFACT_ID" \
            --source-sha "$EXPECTED_SOURCE_SHA" \
            --artifact-digest "$EXPECTED_ARTIFACT_DIGEST" \
            --project-root .

  publish:
    needs: [verify-candidate, create-candidate-tag]
    if: github.repository == 'weekssa/OPRA-EQ-for-UAPP' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out the exact publisher source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platform-tools

      - name: Install pinned Android build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Download the verified candidate archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-candidate-archive-${{ github.run_id }}
          path: ${{ runner.temp }}/promotion-transfer

      - name: Reverify and publish the exact signed APK bytes
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          RELEASE_TAG: ${{ needs.verify-candidate.outputs.release_tag }}
          CANDIDATE_RUN_ID: ${{ needs.verify-candidate.outputs.candidate_run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ needs.verify-candidate.outputs.candidate_artifact_id }}
          EXPECTED_SOURCE_SHA: ${{ needs.verify-candidate.outputs.source_sha }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.verify-candidate.outputs.artifact_digest }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/promote_release_candidate.py publish \
            --tag "$RELEASE_TAG" \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --candidate-artifact-id "$CANDIDATE_ARTIFACT_ID" \
            --source-sha "$EXPECTED_SOURCE_SHA" \
            --artifact-digest "$EXPECTED_ARTIFACT_DIGEST" \
            --build-tools "$ANDROID_HOME/build-tools/36.0.0" \
            --project-root . \
            --archive "$RUNNER_TEMP/promotion-transfer/candidate.zip"
