name: Publish Qualified v0.8.0 Beta Prerelease

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: exact-beta-prerelease-v0.8.0
  cancel-in-progress: false

jobs:
  verify-candidate:
    if: github.repository == 'weekssa/OPRA-EQ-for-UAPP' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the exact publisher source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platform-tools

      - name: Install pinned Android build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Read-only verification of the pinned signed beta artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
        run: >-
          python3 tools/publish_beta_prerelease.py verify
          --project-root .
          --build-tools "$ANDROID_HOME/build-tools/36.0.0"

  publish:
    needs: verify-candidate
    if: github.repository == 'weekssa/OPRA-EQ-for-UAPP' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out the exact publisher source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platform-tools

      - name: Install pinned Android build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Publish the verified beta prerelease without changing stable latest
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: >-
          python3 tools/publish_beta_prerelease.py publish
          --project-root .
          --build-tools "$ANDROID_HOME/build-tools/36.0.0"
