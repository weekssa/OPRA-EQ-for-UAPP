name: Publish EQ Library v0.2.0 Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v0.2.0-once.yml

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'weekssa/OPRA-EQ-for-UAPP'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: "9.4.1"
          cache-provider: basic

      - name: Validate release source
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test "$version_name" = "0.2.0"
          test -f docs/releases/v0.2.0.md
          test -f release-signing-cert.sha256

      - name: Refuse to replace an existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/v0.2.0 >/dev/null 2>&1; then
            echo "Tag v0.2.0 already exists; refusing to replace it" >&2
            exit 1
          fi
          if gh release view v0.2.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v0.2.0 already exists; refusing to replace it" >&2
            exit 1
          fi

      - name: Validate signing secrets
        env:
          OPRA_RELEASE_KEYSTORE_BASE64: ${{ secrets.OPRA_RELEASE_KEYSTORE_BASE64 }}
          OPRA_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.OPRA_RELEASE_KEYSTORE_PASSWORD }}
          OPRA_RELEASE_KEY_ALIAS: ${{ secrets.OPRA_RELEASE_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          : "${OPRA_RELEASE_KEYSTORE_BASE64:?Missing release keystore secret}"
          : "${OPRA_RELEASE_KEYSTORE_PASSWORD:?Missing release keystore password}"
          : "${OPRA_RELEASE_KEY_ALIAS:?Missing release key alias}"

      - name: Restore release keystore
        env:
          OPRA_RELEASE_KEYSTORE_BASE64: ${{ secrets.OPRA_RELEASE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$OPRA_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/eq-library-release.p12"
          chmod 600 "$RUNNER_TEMP/eq-library-release.p12"

      - name: Run release gate and build APK
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --stacktrace

      - name: Align sign verify and checksum
        env:
          OPRA_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.OPRA_RELEASE_KEYSTORE_PASSWORD }}
          OPRA_RELEASE_KEY_ALIAS: ${{ secrets.OPRA_RELEASE_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          unsigned_apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          aligned_apk="$RUNNER_TEMP/eq-library-v0.2.0-aligned.apk"
          output_apk="dist/EQ-Library-v0.2.0.apk"
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          test -f "$unsigned_apk"
          mkdir -p dist
          "$build_tools/zipalign" -p -f 4 "$unsigned_apk" "$aligned_apk"
          "$build_tools/apksigner" sign \
            --ks "$RUNNER_TEMP/eq-library-release.p12" \
            --ks-key-alias "$OPRA_RELEASE_KEY_ALIAS" \
            --ks-pass env:OPRA_RELEASE_KEYSTORE_PASSWORD \
            --key-pass env:OPRA_RELEASE_KEYSTORE_PASSWORD \
            --out "$output_apk" \
            "$aligned_apk"
          "$build_tools/apksigner" verify --verbose --print-certs "$output_apk" | tee dist/apksigner-verification.txt
          actual_fingerprint="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' dist/apksigner-verification.txt | head -n 1 | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          expected_fingerprint="$(tr -d '[:space:]:' < release-signing-cert.sha256 | tr '[:upper:]' '[:lower:]')"
          test -n "$actual_fingerprint"
          test "$actual_fingerprint" = "$expected_fingerprint"
          sha256sum "$output_apk" > "${output_apk}.sha256"

      - name: Upload verified release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EQ-Library-v0.2.0-signed-release
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release and immutable tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: f7afbd254146149f114c17c7d2a7a0ebcae0b91c
        shell: bash
        run: |
          set -euo pipefail
          gh release create v0.2.0 \
            dist/EQ-Library-v0.2.0.apk \
            dist/EQ-Library-v0.2.0.apk.sha256 \
            dist/apksigner-verification.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "EQ Library v0.2.0" \
            --notes-file docs/releases/v0.2.0.md
