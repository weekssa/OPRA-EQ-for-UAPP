name: Review Clear QA APK

on:
  push:
    branches: [v0.3-review-clear-qa]

permissions:
  contents: write

concurrency:
  group: signed-eq-library-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-signed-beta:
    if: github.repository == 'weekssa/OPRA-EQ-for-UAPP'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out exact QA source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: "9.4.1"
          cache-provider: basic

      - name: Validate signing secrets
        env:
          OPRA_RELEASE_KEYSTORE_BASE64: ${{ secrets.OPRA_RELEASE_KEYSTORE_BASE64 }}
          OPRA_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.OPRA_RELEASE_KEYSTORE_PASSWORD }}
          OPRA_RELEASE_KEY_ALIAS: ${{ secrets.OPRA_RELEASE_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          : "${OPRA_RELEASE_KEYSTORE_BASE64:?Missing release keystore secret}"
          : "${OPRA_RELEASE_KEYSTORE_PASSWORD:?Missing release keystore password}"
          : "${OPRA_RELEASE_KEY_ALIAS:?Missing release key alias}"

      - name: Restore release keystore
        env:
          OPRA_RELEASE_KEYSTORE_BASE64: ${{ secrets.OPRA_RELEASE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$OPRA_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/eq-library-release.p12"
          chmod 600 "$RUNNER_TEMP/eq-library-release.p12"

      - name: Run QA gate and build release APK
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --stacktrace

      - name: Align sign and verify QA APK
        env:
          OPRA_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.OPRA_RELEASE_KEYSTORE_PASSWORD }}
          OPRA_RELEASE_KEY_ALIAS: ${{ secrets.OPRA_RELEASE_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          unsigned_apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          aligned_apk="$RUNNER_TEMP/eq-library-qa-aligned.apk"
          mkdir -p dist
          output_apk="dist/EQ-Library-QA-review-clear-${GITHUB_SHA::7}.apk"
          build_tools="$ANDROID_HOME/build-tools/36.0.0"

          "$build_tools/zipalign" -p -f 4 "$unsigned_apk" "$aligned_apk"
          "$build_tools/apksigner" sign \
            --ks "$RUNNER_TEMP/eq-library-release.p12" \
            --ks-key-alias "$OPRA_RELEASE_KEY_ALIAS" \
            --ks-pass env:OPRA_RELEASE_KEYSTORE_PASSWORD \
            --key-pass env:OPRA_RELEASE_KEYSTORE_PASSWORD \
            --out "$output_apk" \
            "$aligned_apk"

          "$build_tools/apksigner" verify --verbose --print-certs "$output_apk" | tee dist/apksigner-verification.txt
          actual_fingerprint="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' dist/apksigner-verification.txt | head -n 1 | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          expected_fingerprint="$(tr -d '[:space:]:' < release-signing-cert.sha256 | tr '[:upper:]' '[:lower:]')"
          test -n "$actual_fingerprint"
          test "$actual_fingerprint" = "$expected_fingerprint"
          sha256sum "$output_apk" > "${output_apk}.sha256"

      - name: Upload QA artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EQ-Library-review-clear-QA-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Publish isolated QA APK link
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source_apk="$(find dist -maxdepth 1 -type f -name 'EQ-Library-QA-review-clear-*.apk' -print -quit)"
          test -n "$source_apk"

          publish_dir="$(mktemp -d)"
          cp "$source_apk" "$publish_dir/EQ-Library-QA-review-clear.apk"
          sha256sum "$publish_dir/EQ-Library-QA-review-clear.apk" > "$publish_dir/EQ-Library-QA-review-clear.apk.sha256"
          cat > "$publish_dir/README.md" <<EOF
          # EQ Library review-clear QA build

          Temporary QA app generated from commit ${GITHUB_SHA}.

          Package: com.weekssa.opraeqforuapp.reviewclearqa
          App label: EQ Library QA

          Direct Android download:
          https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/review-clear-qa-apk/EQ-Library-QA-review-clear.apk

          This app installs beside EQ Library and uses separate Android app data. It contains one synthetic review fixture and must never be merged or released publicly.
          EOF

          cd "$publish_dir"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b review-clear-qa-apk
          git add README.md EQ-Library-QA-review-clear.apk EQ-Library-QA-review-clear.apk.sha256
          git commit -m "Publish isolated review-clear QA APK from ${GITHUB_SHA::7}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:review-clear-qa-apk

          {
            echo "### Review-clear QA APK"
            echo "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/review-clear-qa-apk/EQ-Library-QA-review-clear.apk"
          } >> "$GITHUB_STEP_SUMMARY"
