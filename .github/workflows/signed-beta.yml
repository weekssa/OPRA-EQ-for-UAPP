name: Signed EQ Library Beta Candidate

on:
  workflow_dispatch:
    inputs:
      candidate_target:
        description: Hardware target for the signed testing candidate manifest.
        required: true
        default: ja11
        type: choice
        options:
          - ja11
          - ew300

permissions:
  contents: write
  actions: read

concurrency:
  group: signed-eq-library-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-signed-beta:
    if: github.repository == 'weekssa/OPRA-EQ-for-UAPP' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: "9.4.1"
          cache-provider: basic

      - name: Run beta gate and build release APK
        run: >-
          gradle :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --stacktrace
          -PCANDIDATE_SOURCE_SHA="$GITHUB_SHA"

      - name: Verify minified release output
        shell: bash
        run: |
          set -euo pipefail
          mapping="app/build/outputs/mapping/release/mapping.txt"
          bash tools/verify-r8-mapping.sh "$mapping"

      - name: Verify unsigned APK identity before signing
        shell: bash
        run: |
          set -euo pipefail
          unsigned_apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$unsigned_apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$unsigned_apk" |
            grep -F "package: name='com.weekssa.opraeqforuapp' versionCode='7' versionName='0.7.0'" >/dev/null

      - name: Align sign and verify beta APK
        env:
          OPRA_RELEASE_KEYSTORE_BASE64: ${{ secrets.OPRA_RELEASE_KEYSTORE_BASE64 }}
          OPRA_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.OPRA_RELEASE_KEYSTORE_PASSWORD }}
          OPRA_RELEASE_KEY_ALIAS: ${{ secrets.OPRA_RELEASE_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$version_name"
          unsigned_apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          aligned_apk="$RUNNER_TEMP/eq-library-beta-aligned.apk"
          mkdir -p dist
          output_apk="dist/EQ-Library-v${version_name}-beta-${GITHUB_SHA::7}.apk"
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          mapping="app/build/outputs/mapping/release/mapping.txt"
          r8_mapping_sha256="$(sha256sum "$mapping" | cut -d ' ' -f 1)"
          : "${OPRA_RELEASE_KEYSTORE_BASE64:?Missing release keystore secret}"
          : "${OPRA_RELEASE_KEYSTORE_PASSWORD:?Missing release keystore password}"
          : "${OPRA_RELEASE_KEY_ALIAS:?Missing release key alias}"
          printf '%s' "$OPRA_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/eq-library-release.p12"
          chmod 600 "$RUNNER_TEMP/eq-library-release.p12"
          trap 'rm -f "$RUNNER_TEMP/eq-library-release.p12"' EXIT

          "$build_tools/zipalign" -p -f 4 "$unsigned_apk" "$aligned_apk"
          "$build_tools/apksigner" sign \
            --ks "$RUNNER_TEMP/eq-library-release.p12" \
            --ks-key-alias "$OPRA_RELEASE_KEY_ALIAS" \
            --ks-pass env:OPRA_RELEASE_KEYSTORE_PASSWORD \
            --key-pass env:OPRA_RELEASE_KEYSTORE_PASSWORD \
            --out "$output_apk" \
            "$aligned_apk"

          "$build_tools/apksigner" verify --verbose --print-certs "$output_apk" | tee dist/apksigner-verification.txt
          "$build_tools/zipalign" -c -v 4 "$output_apk" | tee dist/zipalign-verification.txt
          actual_fingerprint="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' dist/apksigner-verification.txt | head -n 1 | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          expected_fingerprint="$(tr -d '[:space:]:' < release-signing-cert.sha256 | tr '[:upper:]' '[:lower:]')"
          test -n "$actual_fingerprint"
          test "$actual_fingerprint" = "$expected_fingerprint"
          sha256sum "$output_apk" > "${output_apk}.sha256"
          apk_sha256="$(cut -d ' ' -f 1 "${output_apk}.sha256")"
          candidate_target="${{ inputs.candidate_target }}"
          case "$candidate_target" in
            ja11)
              capability_profile="FiiO JA11 exact model; five-band PEQ; global EQ gain"
              test_plan="docs/FIIO_JA11_HANDS_ON_CHECKLIST.md"
              evidence_ids="JA11-SOFTWARE"
              outstanding="owner hardware Flash/readback/power-cycle persistence validation; merge/publication approval and final release/public-support approval"
              ;;
            ew300)
              capability_profile="EW300 exact fingerprint; five-band direct-Hz Peak"
              test_plan="docs/EW300_DSP_HANDS_ON_CHECKLIST.md"
              evidence_ids="E001,E043,E044,E045,E046,E047,E048"
              outstanding="final beta clean-install/upgrade/accessibility/offline/error validation; owner merge/publication approval"
              ;;
            *)
              echo "Unsupported candidate target: $candidate_target" >&2
              exit 1
              ;;
          esac
          jq -n \
            --arg sourceSha "$GITHUB_SHA" \
            --arg candidateTarget "$candidate_target" \
            --arg apk "$(basename "$output_apk")" \
            --arg apkSha256 "$apk_sha256" \
            --arg packageId "com.weekssa.opraeqforuapp" \
            --arg versionName "$version_name" \
            --arg versionCode "7" \
            --arg signerSha256 "$actual_fingerprint" \
            --arg r8MappingSha256 "$r8_mapping_sha256" \
            --arg capabilityProfile "$capability_profile" \
            --arg testPlan "$test_plan" \
            --arg evidence "$evidence_ids" \
            --arg outstanding "$outstanding" \
            '{sourceSha:$sourceSha, candidateTarget:$candidateTarget, apk:$apk, apkSha256:$apkSha256, packageId:$packageId, versionName:$versionName, versionCode:($versionCode|tonumber), signerSha256:$signerSha256, r8MinificationEnabled:true, r8MappingSha256:$r8MappingSha256, capabilityProfile:$capabilityProfile, testPlan:$testPlan, evidenceIds:($evidence|split(",")), outstanding:$outstanding}' \
            > dist/candidate-manifest.json
          jq -e --arg sourceSha "$GITHUB_SHA" --arg candidateTarget "$candidate_target" --arg evidence "$evidence_ids" '
            .sourceSha == $sourceSha and
            .candidateTarget == $candidateTarget and
            .packageId == "com.weekssa.opraeqforuapp" and
            .versionName == "0.7.0" and
            .versionCode == 7 and
            .r8MinificationEnabled == true and
            (.r8MappingSha256 | test("^[a-f0-9]{64}$")) and
            .evidenceIds == ($evidence | split(",")) and
            (if $candidateTarget == "ja11" then
              (.capabilityProfile | contains("FiiO JA11")) and
              .testPlan == "docs/FIIO_JA11_HANDS_ON_CHECKLIST.md" and
              (.outstanding | contains("owner hardware"))
             else
              (.capabilityProfile | contains("EW300")) and
              .testPlan == "docs/EW300_DSP_HANDS_ON_CHECKLIST.md" and
              (.outstanding | contains("hardware session") | not)
             end) and
            (.outstanding | contains("merge/publication approval"))
          ' dist/candidate-manifest.json > /dev/null

      - name: Set up signed-beta emulator
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "emulator" "system-images;android-35;google_apis;x86_64"
          avd_home="$RUNNER_TEMP/avd"
          mkdir -p "$avd_home"
          export ANDROID_AVD_HOME="$avd_home"
          echo "no" | avdmanager create avd --force --name opra_signed_beta --package "system-images;android-35;google_apis;x86_64" --device pixel_6
          sudo chown "$(id -un)" /dev/kvm
          "$ANDROID_SDK_ROOT/emulator/emulator" -accel-check
          nohup "$ANDROID_SDK_ROOT/emulator/emulator" \
            -avd opra_signed_beta -no-window -noaudio -no-boot-anim -no-snapshot -wipe-data \
            -gpu swiftshader_indirect > "$RUNNER_TEMP/signed-beta-emulator.log" 2>&1 &
          emulator_pid=$!
          for attempt in $(seq 1 90); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/signed-beta-emulator.log"
              exit 1
            fi
            if adb get-state 2>/dev/null | grep -qx device; then break; fi
            if [[ "$attempt" -eq 90 ]]; then
              cat "$RUNNER_TEMP/signed-beta-emulator.log"
              exit 1
            fi
            sleep 2
          done
          adb wait-for-device
          timeout 240 bash -c 'until [[ "$(adb shell getprop sys.boot_completed | tr -d "\r")" == "1" ]]; do sleep 5; done'

      - name: Install signed beta APK
        shell: bash
        run: |
          set -euo pipefail
          output_apk="dist/$(find dist -maxdepth 1 -type f -name 'EQ-Library-v*.apk' -printf '%f\n' -quit)"
          test -f "$output_apk"
          if ! install_output="$(adb install -r "$output_apk" 2>&1)"; then
            echo "$install_output"
            adb logcat -d > "$RUNNER_TEMP/signed-beta-logcat.txt" || true
            exit 1
          fi
          echo "$install_output"
          package_dump="$(adb shell dumpsys package com.weekssa.opraeqforuapp)"
          echo "$package_dump" | grep -q 'versionCode=7'
          echo "$package_dump" | grep -q 'versionName=0.7.0'

      - name: Cold-launch signed beta APK
        shell: bash
        run: |
          set -euo pipefail
          adb shell am force-stop com.weekssa.opraeqforuapp
          if ! launch_output="$(adb shell am start -W -n com.weekssa.opraeqforuapp/.MainActivity 2>&1)"; then
            echo "$launch_output"
            adb logcat -d > "$RUNNER_TEMP/signed-beta-logcat.txt" || true
            exit 1
          fi
          echo "$launch_output"
          echo "$launch_output" | grep -q 'Status: ok'
          sleep 5
          adb logcat -d > "$RUNNER_TEMP/signed-beta-logcat.txt"

      - name: Upload signed-beta emulator diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-beta-emulator-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/signed-beta-emulator.log
            ${{ runner.temp }}/signed-beta-logcat.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload signed beta candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EQ-Library-signed-beta-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Publish mobile-test APKs and immutable candidate copy
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED_V06_READ_ONLY_ARTIFACT_ID: "10134900164"
          PINNED_V06_READ_ONLY_COMMIT: "d3d227de45751f6606b75637a2fd311249afa88d"
          PINNED_V06_READ_ONLY_SHA256: "ea8235ee1ba2828873b488054b25d40c917b844c2d76a813bf9e038cf31c8ee5"
        shell: bash
        run: |
          set -euo pipefail
          source_apk="$(find dist -maxdepth 1 -type f -name 'EQ-Library-v*.apk' -print -quit)"
          test -n "$source_apk"
          version_name="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$version_name"

          publish_dir="$(mktemp -d)"
          if git clone --depth 1 --branch mobile-test-apk \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$publish_dir"; then
            :
          else
            rm -rf "$publish_dir"
            publish_dir="$(mktemp -d)"
            cd "$publish_dir"
            git init
            git checkout -b mobile-test-apk
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi

          cd "$publish_dir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p candidates

          stable_name="EQ-Library-mobile-test.apk"
          versioned_name="EQ-Library-v${version_name}-mobile-test.apk"
          zip_name="EQ-Library-v${version_name}-mobile-test.zip"
          immutable_name="EQ-Library-v${version_name}-beta-${GITHUB_SHA::7}.apk"

          cp "$GITHUB_WORKSPACE/$source_apk" "$stable_name"
          cp "$GITHUB_WORKSPACE/$source_apk" "$versioned_name"
          cp "$GITHUB_WORKSPACE/$source_apk" "candidates/$immutable_name"
          zip -9 -j "$zip_name" "$versioned_name"
          sha256sum "$stable_name" > "${stable_name}.sha256"
          sha256sum "$versioned_name" > "${versioned_name}.sha256"
          sha256sum "$zip_name" > "${zip_name}.sha256"
          sha256sum "candidates/$immutable_name" > "candidates/${immutable_name}.sha256"

          pinned_name="EQ-Library-v0.6.0-beta-${PINNED_V06_READ_ONLY_COMMIT::7}.apk"
          if [[ ! -f "candidates/$pinned_name" ]]; then
            pinned_zip="$RUNNER_TEMP/pinned-v06-read-only.zip"
            pinned_dir="$RUNNER_TEMP/pinned-v06-read-only"
            mkdir -p "$pinned_dir"
            curl --fail --location --retry 3 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PINNED_V06_READ_ONLY_ARTIFACT_ID}/zip" \
              --output "$pinned_zip"
            unzip -q "$pinned_zip" -d "$pinned_dir"
            pinned_source="$(find "$pinned_dir" -type f -name "EQ-Library-v0.6.0-beta-${PINNED_V06_READ_ONLY_COMMIT::7}.apk" -print -quit)"
            test -n "$pinned_source"
            actual_pinned_sha="$(sha256sum "$pinned_source" | awk '{print $1}')"
            test "$actual_pinned_sha" = "$PINNED_V06_READ_ONLY_SHA256"
            cp "$pinned_source" "candidates/$pinned_name"
            printf '%s  %s\n' "$PINNED_V06_READ_ONLY_SHA256" "$pinned_name" > "candidates/${pinned_name}.sha256"
          fi

          cat > README.md <<EOF
          # EQ Library mobile test builds

          Latest signed beta generated from commit ${GITHUB_SHA} for app version ${version_name}.

          Latest convenience APK (moves as the development branch advances):
          https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/mobile-test-apk/${stable_name}

          Latest version convenience APK (also moves while version ${version_name} is under development):
          https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/mobile-test-apk/${versioned_name}

          Exact immutable candidate for this commit:
          https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/mobile-test-apk/candidates/${immutable_name}

          Pinned v0.6 Black Pearl read-only qualification candidate:
          https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/mobile-test-apk/candidates/${pinned_name}

          ZIP fallback for the latest convenience build:
          https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/mobile-test-apk/${zip_name}

          Files under candidates/ are append-only exact-commit test candidates. Stable/versioned convenience names are not qualification provenance.
          This branch is only a temporary hands-on testing surface. It is not a public release.
          EOF

          git add README.md "$stable_name" "$stable_name.sha256" \
            "$versioned_name" "$versioned_name.sha256" "$zip_name" "$zip_name.sha256" candidates/
          if git diff --cached --quiet; then
            echo "No mobile-test publication changes."
          else
            git commit -m "Publish signed mobile test APK from ${GITHUB_SHA::7}"
            git push origin HEAD:mobile-test-apk
          fi

          {
            echo "### Mobile test APK"
            echo "Latest convenience: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/mobile-test-apk/${stable_name}"
            echo ""
            echo "Exact immutable candidate: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/mobile-test-apk/candidates/${immutable_name}"
            echo ""
            echo "Pinned v0.6 read-only candidate: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/mobile-test-apk/candidates/${pinned_name}"
          } >> "$GITHUB_STEP_SUMMARY"
