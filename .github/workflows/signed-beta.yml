name: Signed EQ Library Beta Candidate

on:
  push:
    branches: [eq-library-beta, eq-library-community-v0.3, 'v0.3-*']

permissions:
  contents: write

concurrency:
  group: signed-eq-library-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-release-polish-docs:
    if: github.repository == 'weekssa/OPRA-EQ-for-UAPP' && contains(github.event.head_commit.message, '[sync-v03-docs]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - name: Synchronize release-polish documentation
        run: python3 tools/sync_v03_release_polish_docs.py
      - name: Validate documentation diff
        run: git diff --check
      - name: Commit documentation sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No documentation changes were produced."
            exit 1
          fi
          git commit -m "Synchronize v0.3 release-polish documentation"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  build-signed-beta:
    if: github.repository == 'weekssa/OPRA-EQ-for-UAPP' && !contains(github.event.head_commit.message, '[sync-v03-docs]')
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: "9.4.1"
          cache-provider: basic

      - name: Validate signing secrets
        env:
          OPRA_RELEASE_KEYSTORE_BASE64: ${{ secrets.OPRA_RELEASE_KEYSTORE_BASE64 }}
          OPRA_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.OPRA_RELEASE_KEYSTORE_PASSWORD }}
          OPRA_RELEASE_KEY_ALIAS: ${{ secrets.OPRA_RELEASE_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          : "${OPRA_RELEASE_KEYSTORE_BASE64:?Missing release keystore secret}"
          : "${OPRA_RELEASE_KEYSTORE_PASSWORD:?Missing release keystore password}"
          : "${OPRA_RELEASE_KEY_ALIAS:?Missing release key alias}"

      - name: Restore release keystore
        env:
          OPRA_RELEASE_KEYSTORE_BASE64: ${{ secrets.OPRA_RELEASE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$OPRA_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/eq-library-release.p12"
          chmod 600 "$RUNNER_TEMP/eq-library-release.p12"

      - name: Run beta gate and build release APK
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --stacktrace

      - name: Align sign and verify beta APK
        env:
          OPRA_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.OPRA_RELEASE_KEYSTORE_PASSWORD }}
          OPRA_RELEASE_KEY_ALIAS: ${{ secrets.OPRA_RELEASE_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$version_name"
          unsigned_apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          aligned_apk="$RUNNER_TEMP/eq-library-beta-aligned.apk"
          mkdir -p dist
          output_apk="dist/EQ-Library-v${version_name}-beta-${GITHUB_SHA::7}.apk"
          build_tools="$ANDROID_HOME/build-tools/36.0.0"

          "$build_tools/zipalign" -p -f 4 "$unsigned_apk" "$aligned_apk"
          "$build_tools/apksigner" sign \
            --ks "$RUNNER_TEMP/eq-library-release.p12" \
            --ks-key-alias "$OPRA_RELEASE_KEY_ALIAS" \
            --ks-pass env:OPRA_RELEASE_KEYSTORE_PASSWORD \
            --key-pass env:OPRA_RELEASE_KEYSTORE_PASSWORD \
            --out "$output_apk" \
            "$aligned_apk"

          "$build_tools/apksigner" verify --verbose --print-certs "$output_apk" | tee dist/apksigner-verification.txt
          actual_fingerprint="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' dist/apksigner-verification.txt | head -n 1 | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          expected_fingerprint="$(tr -d '[:space:]:' < release-signing-cert.sha256 | tr '[:upper:]' '[:lower:]')"
          test -n "$actual_fingerprint"
          test "$actual_fingerprint" = "$expected_fingerprint"
          sha256sum "$output_apk" > "${output_apk}.sha256"

      - name: Upload signed beta candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EQ-Library-signed-beta-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Publish stable mobile-test APK link
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source_apk="$(find dist -maxdepth 1 -type f -name 'EQ-Library-v*.apk' -print -quit)"
          test -n "$source_apk"

          publish_dir="$(mktemp -d)"
          cp "$source_apk" "$publish_dir/EQ-Library-v0.3-mobile-test.apk"
          sha256sum "$publish_dir/EQ-Library-v0.3-mobile-test.apk" > "$publish_dir/EQ-Library-v0.3-mobile-test.apk.sha256"
          cat > "$publish_dir/README.md" <<EOF
          # EQ Library v0.3 mobile test build

          Signed beta generated from commit `${GITHUB_SHA}`.

          Direct Android download:
          https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/mobile-test-apk/EQ-Library-v0.3-mobile-test.apk

          This branch is only a temporary hands-on testing surface. It is not a public v0.3 release.
          EOF

          cd "$publish_dir"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b mobile-test-apk
          git add README.md EQ-Library-v0.3-mobile-test.apk EQ-Library-v0.3-mobile-test.apk.sha256
          git commit -m "Publish signed v0.3 mobile test APK from ${GITHUB_SHA::7}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:mobile-test-apk

          {
            echo "### Mobile test APK"
            echo "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/mobile-test-apk/EQ-Library-v0.3-mobile-test.apk"
          } >> "$GITHUB_STEP_SUMMARY"
