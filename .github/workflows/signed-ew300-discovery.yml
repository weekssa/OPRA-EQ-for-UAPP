name: Signed EW300 Read-Only Discovery Candidate

on:
  push:
    branches: [ew300-discovery-candidate]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: signed-ew300-discovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-signed-discovery:
    if: github.repository == 'weekssa/OPRA-EQ-for-UAPP'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: "9.4.1"
          cache-provider: basic

      - name: Validate signing secrets
        env:
          OPRA_RELEASE_KEYSTORE_BASE64: ${{ secrets.OPRA_RELEASE_KEYSTORE_BASE64 }}
          OPRA_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.OPRA_RELEASE_KEYSTORE_PASSWORD }}
          OPRA_RELEASE_KEY_ALIAS: ${{ secrets.OPRA_RELEASE_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          : "${OPRA_RELEASE_KEYSTORE_BASE64:?Missing release keystore secret}"
          : "${OPRA_RELEASE_KEYSTORE_PASSWORD:?Missing release keystore password}"
          : "${OPRA_RELEASE_KEY_ALIAS:?Missing release key alias}"

      - name: Restore release keystore
        env:
          OPRA_RELEASE_KEYSTORE_BASE64: ${{ secrets.OPRA_RELEASE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$OPRA_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/eq-library-release.p12"
          chmod 600 "$RUNNER_TEMP/eq-library-release.p12"

      - name: Run read-only discovery gate and build APK
        run: gradle :app:testDebugUnitTest :app:lintDiagnostic :app:assembleDiagnostic --stacktrace

      - name: Align sign and verify discovery APK
        env:
          OPRA_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.OPRA_RELEASE_KEYSTORE_PASSWORD }}
          OPRA_RELEASE_KEY_ALIAS: ${{ secrets.OPRA_RELEASE_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          unsigned_apk="app/build/outputs/apk/diagnostic/app-diagnostic-unsigned.apk"
          aligned_apk="$RUNNER_TEMP/ew300-discovery-aligned.apk"
          output_apk="dist/EW300-USB-Descriptor-Discovery-${GITHUB_SHA::7}.apk"
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p dist

          test -f "$unsigned_apk"
          "$build_tools/zipalign" -p -f 4 "$unsigned_apk" "$aligned_apk"
          "$build_tools/apksigner" sign \
            --ks "$RUNNER_TEMP/eq-library-release.p12" \
            --ks-key-alias "$OPRA_RELEASE_KEY_ALIAS" \
            --ks-pass env:OPRA_RELEASE_KEYSTORE_PASSWORD \
            --key-pass env:OPRA_RELEASE_KEYSTORE_PASSWORD \
            --out "$output_apk" \
            "$aligned_apk"

          "$build_tools/apksigner" verify --verbose --print-certs "$output_apk" | tee dist/apksigner-verification.txt
          actual_fingerprint="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' dist/apksigner-verification.txt | head -n 1 | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          expected_fingerprint="$(tr -d '[:space:]:' < release-signing-cert.sha256 | tr '[:upper:]' '[:lower:]')"
          test -n "$actual_fingerprint"
          test "$actual_fingerprint" = "$expected_fingerprint"
          sha256sum "$output_apk" > "${output_apk}.sha256"

      - name: Upload signed read-only discovery candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EW300-signed-read-only-discovery-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
