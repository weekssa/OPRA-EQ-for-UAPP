name: Temporary reconcile source lifecycle

on:
  push:
    branches:
      - source-automation-reddit-pause
    paths:
      - '.github/workflows/temporary-reconcile-source-lifecycle.yml'

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out maintenance branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: source-automation-reddit-pause
          fetch-depth: 1

      - name: Reconcile operational source states
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          registry_path = Path('config/source_registry.json')
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          assert registry['registry_version'] == '0.4.0-source-automation-1'
          registry['registry_version'] = '0.4.0-source-automation-2'
          sources = {item['id']: item for item in registry['sources']}

          reddit = sources['reddit-audio']
          assert reddit['lifecycle'] == 'active'
          assert reddit['cadence'] == 'daily'
          reddit['lifecycle'] = 'paused'
          reddit_note = (
              ' As of 2026-09-06, GitHub-hosted unauthenticated Reddit JSON listing/search '
              'requests returned HTTP 403 Blocked across all configured r/headphones and '
              'r/oratory1990 probes. Live scanning is paused until a compliant public access '
              'path is validated; existing archived and curated Reddit EQs remain preserved.'
          )
          if reddit_note.strip() not in reddit['license_notes']:
              reddit['license_notes'] += reddit_note

          for source_id in ('head-fi', 'audio-science-review'):
              source = sources[source_id]
              assert source['lifecycle'] == 'active'
              assert source['cadence'] == 'weekly'
              source['cadence'] = 'manual'
              manual_note = (
                  ' The current publication lane is curated/manual; no autonomous live-site '
                  'scanner is claimed until a robust public adapter is validated.'
              )
              if manual_note.strip() not in source['license_notes']:
                  source['license_notes'] += manual_note

          registry_path.write_text(
              json.dumps(registry, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )

          health_path = Path('catalog/source_health.json')
          health = json.loads(health_path.read_text(encoding='utf-8'))
          health_by_id = {item['source_id']: item for item in health['sources']}
          reddit_health = health_by_id['reddit-audio']
          assert reddit_health['consecutive_failures'] >= 2
          assert reddit_health['last_successful_scan_at'] is None
          assert reddit_health['lifecycle'] == 'active'
          reddit_health['lifecycle'] = 'paused'
          health_path.write_text(
              json.dumps(health, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )

          plan_path = Path('docs/FUTURE_SOURCE_AUTOMATION_PLAN.md')
          text = plan_path.read_text(encoding='utf-8')
          replacements = {
              '- **Reddit audio communities:** whole-library targeted discovery runs without a priority-headphone allowlist. It searches high-signal public structured-PEQ posts, matches only unambiguous headphone identities already known to the canonical catalog, publishes through the normal dedupe/revision pipeline, and records durable source-health state.':
              '- **Reddit audio communities:** the whole-library targeted adapter is implemented and preserves failure isolation, but live GitHub-hosted anonymous JSON scanning is currently **paused** after every configured `r/headphones` and `r/oratory1990` listing/search probe returned HTTP 403 `Blocked` on 2026-09-06. Existing curated and archived Reddit EQs remain valid and preserved. Do not describe Reddit as autonomously scanned until a compliant public access path is validated.',
              '- **Head-Fi and Audio Science Review:** their already-qualified curated publication lanes remain valid, but they do not yet have a sufficiently robust direct live-site adapter in this milestone. Do not describe them as autonomously scanned until that exists; their curated inputs continue to feed the same generic community publisher.':
              '- **Head-Fi and Audio Science Review:** their already-qualified curated publication lanes remain valid and are explicitly registered with **manual** cadence. They do not yet have a sufficiently robust direct live-site adapter in this milestone. Do not describe them as autonomously scanned until that exists; their curated inputs continue to feed the same generic community publisher.',
              'This moves community expansion beyond the original launch queue and expands General EQ population without changing Android runtime behavior or requiring users to connect accounts.':
              'This moves community expansion beyond the original launch queue and expands General EQ population without changing Android runtime behavior or requiring users to connect accounts. Public Discourse and qualified General-source automation are live; Reddit remains safely paused until compliant public access is available.',
              'An `active` source must not silently remain with no successful scan history indefinitely. The next forum-adapter priority is Head-Fi and Audio Science Review, using only stable public access paths that do not require authentication, bypass controls, or brittle whole-site crawling.':
              'An `active` scheduled source must not silently remain with no successful scan history indefinitely. The next forum-adapter priorities are a compliant public Reddit access path and robust live adapters for Head-Fi and Audio Science Review, using only stable public access paths that do not require authentication, bypass controls, or brittle whole-site crawling.',
              '10. Head-Fi and Audio Science Review are either backed by robust live adapters or explicitly represented as curated/manual rather than silently appearing fully automated.':
              '10. Reddit live scanning is either restored through a compliant public access path or remains explicitly paused, and Head-Fi / Audio Science Review are either backed by robust live adapters or explicitly represented as curated/manual rather than silently appearing fully automated.'
          }
          for old, new in replacements.items():
              count = text.count(old)
              assert count == 1, (old, count)
              text = text.replace(old, new)
          plan_path.write_text(text, encoding='utf-8')
          PY

      - name: Validate operational state
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/catalog_pipeline.py validate-registry --registry config/source_registry.json
          PYTHONPATH=tools python3 -m unittest discover -s tools -p 'test_currentness_scheduler.py' -v
          PYTHONPATH=tools python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from catalog_pipeline import load_health
          from currentness_scheduler import build_currentness_plan
          from pathlib import Path

          registry = json.loads(Path('config/source_registry.json').read_text(encoding='utf-8'))
          health = load_health(Path('catalog/source_health.json'))
          plan = build_currentness_plan(registry, health, now=datetime(2026, 9, 7, tzinfo=timezone.utc))
          due = {item['source_id'] for item in plan['known_source_scans']}
          assert 'reddit-audio' not in due
          assert 'head-fi' not in due
          assert 'audio-science-review' not in due
          source_by_id = {item['id']: item for item in registry['sources']}
          assert source_by_id['reddit-audio']['lifecycle'] == 'paused'
          assert source_by_id['head-fi']['cadence'] == 'manual'
          assert source_by_id['audio-science-review']['cadence'] == 'manual'
          print('operational source lifecycle validation OK')
          PY

      - name: Commit reconciled source state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/source_registry.json catalog/source_health.json docs/FUTURE_SOURCE_AUTOMATION_PLAN.md
          git commit -m "Reconcile community source automation status"
          git push origin HEAD:source-automation-reddit-pause
