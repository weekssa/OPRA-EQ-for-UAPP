name: Apply approved new-EQ review UX

on:
  push:
    branches: [v0.3-release-polish]
    paths:
      - .github/workflows/v0.3-new-eq-review-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply approved selection-review behavior
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def p(path):
              return Path(path)

          def replace_once(path, old, new):
              path = p(path)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}: {old[:120]!r}")
              path.write_text(text.replace(old, new, 1))

          def replace_between(path, start, end, new_body):
              path = p(path)
              text = path.read_text()
              a = text.find(start)
              if a < 0:
                  raise SystemExit(f"Start marker not found in {path}: {start!r}")
              b = text.find(end, a + len(start))
              if b < 0:
                  raise SystemExit(f"End marker not found in {path}: {end!r}")
              path.write_text(text[:a] + new_body + text[b:])

          # Selection domain: future catalog profiles never silently become selected. The legacy
          # autoIncludeNewProfiles boolean is retained in storage/API compatibility but now carries
          # the per-headphone in-app notification preference.
          p('app/src/main/java/com/weekssa/opraeqforuapp/domain/managed/ManagedSelection.kt').write_text('''package com.weekssa.opraeqforuapp.domain.managed

