'''### New headphone selection and new-EQ review — approved v0.3 behavior

A never-added headphone starts with **zero EQ profiles selected**. The EQ Library selection screen is an exact chooser: future catalog refreshes never silently change a saved selection.

Every usable canonical parametric EQ is represented as a selectable checkbox. Active-output capability is presented separately as Exact, Optimized, or Not exportable; a valid canonical EQ remains visible and selectable/savable even when the active output cannot represent it. Output capability must never become a catalog-visibility or canonical-selection filter.

Provide Select all and Select none.

After a headphone is added to My EQs, its detail screen owns a per-headphone **Notify me about new EQs** preference, ON by default for newly added headphones. This is an in-app review mechanism, not Android notification permission and not automatic import/selection:

- new verified and Unverified EQs always enter EQ Library normally;
- when notification review is ON, newly discovered profiles for that headphone are marked for review and My EQs shows a concise `N new EQs` indication;
- a materially changed selected tuning may appear as `EQ updated` in the same review surface;
- opening the review does not acknowledge it;
- **Add selected** adds only the checked new EQs to the active output, initiates their normal initial export, and marks the displayed batch reviewed;
- **Dismiss** adds nothing and marks the displayed batch reviewed; those EQs remain visible in EQ Library and are not hidden/deleted;
- Android Back leaves the review pending;
- turning the preference OFF clears the current pending review and future arrivals do not build a hidden backlog; turning it back ON applies to subsequent arrivals;
- review state is persisted against stored canonical/profile identity so restart/refresh does not repeatedly report the same arrival;
- selections remain output-specific, while the notification preference is headphone-level;
- hidden canonical lineages remain hidden and must not be used to nag the user repeatedly.

The legacy database field name `autoIncludeNewProfiles` is retained during v0.3 migration compatibility only; its product semantics are now the notification preference above and it must never cause silent selection.

''')

