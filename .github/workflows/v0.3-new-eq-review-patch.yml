    com.weekssa.opraeqforuapp.domain.export.DeviceExportability.EXACT -> "Exact"
    com.weekssa.opraeqforuapp.domain.export.DeviceExportability.OPTIMIZED -> "Optimized"
    com.weekssa.opraeqforuapp.domain.export.DeviceExportability.NOT_REPRESENTABLE -> "Not exportable"
}
