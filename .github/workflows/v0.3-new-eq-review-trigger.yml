name: Apply approved new-EQ review implementation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'v0.3-release-polish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v0.3-release-polish
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract and apply approved patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/v0.3-new-eq-review-patch.yml').read_text()
          marker = "          python3 <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          block = source[start:end]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply_new_eq_review.py').write_text('\n'.join(lines) + '\n')
          PY
          python3 /tmp/apply_new_eq_review.py
      - name: Run focused Android validation
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --stacktrace
      - name: Run catalog and repository validation
        run: |
          python3 -m unittest tools.test_catalog_pipeline tools.test_catalog_merge tools.test_general_preset_publish
          python3 tools/catalog_pipeline.py validate --catalog catalog/catalog.json --registry config/source_registry.json
          git diff --check
      - name: Commit implementation and remove temporary workflows
        shell: bash
        run: |
          git rm .github/workflows/v0.3-new-eq-review-patch.yml .github/workflows/v0.3-new-eq-review-trigger.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app docs CHANGELOG.md
          git commit -m "Replace automatic EQ inclusion with review notifications"
          git push origin HEAD:v0.3-release-polish
